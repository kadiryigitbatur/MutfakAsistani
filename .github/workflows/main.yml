name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: API anahtarını uygulamaya göm
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: |
          sed -i "s|const EMBEDDED_KEY = '';|const EMBEDDED_KEY = '$GEMINI_API_KEY';|" app/src/main/assets/index.html && grep -c "const EMBEDDED_KEY = '$GEMINI_API_KEY'" app/src/main/assets/index.html
          if [ -n "$PLACES_API_KEY" ]; then sed -i "s|const PLACES_KEY = '';|const PLACES_KEY = '$PLACES_API_KEY';|" app/src/main/assets/index.html; echo "Places anahtari eklendi"; else echo "Places anahtari yok: restoranlar Haritalar baglantisiyla"; fi
      - name: Derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease :app:bundleRelease --no-daemon 2>&1 | tee build.log || {
            grep -nE "^e: |error:|Error:|What went wrong|Unresolved|Type mismatch|Cannot|expected" build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          }
      - name: İmzayı kontrol et
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          SIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          GOT=$($SIGNER verify --print-certs "$APK" | grep -m1 "SHA-256" | awk '{print $NF}')
          if [ "$GOT" = "f993ad9255ef12cf053b13b42626005d9d1441e2e4c242605bf27ece66aef021" ]; then echo "::notice::Sabit anahtarla imzalandi"; else echo "::error::Imza farkli: $GOT"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: MutfakAsistani-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MutfakAsistani-aab-PlayStore
          path: app/build/outputs/bundle/release/*.aab
