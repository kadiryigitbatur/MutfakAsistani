<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mutfak Asistanı · AI Kitchen Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Tema titremesini önlemek için erken uygula
  try {
    var th = JSON.parse(localStorage.getItem('kitchen.theme') || 'null');
    if (!th) th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = th;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
:root {
  --bg:#EDF2EA; --surface:#FFFFFF; --surface-2:#F5F8F3; --ink:#15241D; --muted:#586B60; --line:#D5DFD3;
  --accent:#1F6B45; --accent-ink:#FFFFFF; --accent-soft:#DDEFE3; --sun:#F2B01E; --sun-ink:#3A2A00;
  --warn-bg:#FFF0D1; --warn-ink:#7A4B00; --ok-bg:#DDF1E3; --ok-ink:#17502F; --bad:#C8452A;
  --tl1:90%; --tl2:82%; --shadow:0 1px 2px rgba(21,36,29,.06), 0 8px 24px -12px rgba(21,36,29,.18);
  --radius:16px; --font-display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body:'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
:root[data-theme="dark"] {
  --bg:#0D1612; --surface:#15231C; --surface-2:#1B2C24; --ink:#E8F0EA; --muted:#9BB0A4; --line:#27392F;
  --accent:#5FCB8D; --accent-ink:#0D1612; --accent-soft:#1D3A2B; --sun:#F2B01E; --sun-ink:#3A2A00;
  --warn-bg:#3A2D10; --warn-ink:#F6D58B; --ok-bg:#183626; --ok-ink:#9FE3BB; --bad:#FF8466;
  --tl1:24%; --tl2:18%; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*,*::before,*::after { box-sizing:border-box; }
html { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }
body { margin:0; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); font-family:var(--font-body); background:var(--bg); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
h1,h2,h3 { font-family:var(--font-display); margin:0; line-height:1.15; letter-spacing:-.01em; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
[hidden] { display:none !important; }
:focus-visible { outline:3px solid var(--sun); outline-offset:2px; border-radius:8px; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- Üst bar ---------- */
.topbar { max-width:1280px; margin:0 auto; padding:18px 20px 8px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:12px; margin-right:auto; min-width:0; }
.brand-mark { width:44px; height:44px; border-radius:14px; background:var(--sun); color:var(--sun-ink); display:grid; place-items:center; font-size:24px; flex:none; }
.brand h1 { font-size:clamp(1.35rem, 3vw, 1.9rem); font-weight:800; }
.brand p { margin:2px 0 0; color:var(--muted); font-size:.92rem; }
.tools { display:flex; gap:8px; align-items:center; }
.icon-btn { position:relative; height:42px; min-width:42px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:600; font-size:.9rem; }
.icon-btn:hover { background:var(--surface-2); }
.icon-btn .count { background:var(--accent); color:var(--accent-ink); border-radius:999px; font-size:.72rem; min-width:20px; height:20px; padding:0 6px; display:grid; place-items:center; }

/* ---------- Ana yerleşim ---------- */
.layout { max-width:1280px; margin:0 auto; padding:12px 20px 60px; display:grid; grid-template-columns:minmax(0,380px) minmax(0,1fr); gap:24px; align-items:start; }
@media (max-width: 960px) { .layout { grid-template-columns:1fr; } }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:22px; }
@media (min-width: 961px) { .panel { position:sticky; top:16px; max-height:calc(100vh - 32px); overflow-y:auto; } }
.field-title { font-size:1.05rem; font-weight:700; margin-bottom:10px; font-family:var(--font-display); }
.hint { color:var(--muted); font-size:.85rem; margin:6px 0 0; }

/* Malzeme giriş kutusu */
.chipbox { display:flex; flex-wrap:wrap; gap:6px; padding:8px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface-2); min-height:56px; cursor:text; }
.chipbox:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.chipbox input { flex:1; min-width:140px; border:0; background:transparent; outline:0; padding:6px 6px; }
.chip { display:inline-flex; align-items:center; gap:4px; background:var(--accent-soft); color:var(--accent); padding:4px 4px 4px 12px; border-radius:999px; font-weight:600; font-size:.9rem; }
:root[data-theme="light"] .chip { color:var(--accent); }
.chip button { border:0; background:transparent; width:22px; height:22px; border-radius:50%; line-height:1; font-size:16px; color:inherit; }
.chip button:hover { background:rgba(0,0,0,.1); }
.quick { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.quick button { border:1px dashed var(--line); background:transparent; border-radius:999px; padding:3px 11px; font-size:.85rem; color:var(--muted); }
.quick button:hover { border-color:var(--accent); color:var(--accent); }

/* Seçim düğmeleri */
.toggles { display:flex; flex-wrap:wrap; gap:8px; }
.toggle { border:1.5px solid var(--line); background:var(--surface); border-radius:12px; padding:7px 12px; font-weight:600; font-size:.9rem; display:inline-flex; align-items:center; gap:6px; transition:background .15s, border-color .15s; }
.toggle:hover { border-color:var(--accent); }
.toggle[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.toggle .flag { font-size:1.15rem; line-height:1; }

.options { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.options label { display:flex; flex-direction:column; gap:5px; font-size:.85rem; font-weight:600; color:var(--muted); }
.options select { height:42px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); padding:0 10px; color:var(--ink); }
.stepper { display:flex; align-items:center; height:42px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); overflow:hidden; }
.stepper button { width:40px; height:100%; border:0; background:transparent; font-size:1.2rem; font-weight:700; }
.stepper button:hover { background:var(--accent-soft); }
.stepper output { flex:1; text-align:center; font-weight:700; color:var(--ink); }

.btn { border:0; border-radius:14px; padding:14px 18px; font-weight:700; font-size:1rem; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary { background:var(--accent); color:var(--accent-ink); }
.btn-primary:hover { filter:brightness(1.08); }
.btn-primary:disabled { opacity:.6; cursor:progress; }
.btn-ghost { background:var(--surface-2); border:1px solid var(--line); color:var(--ink); }
.btn-ghost:hover { background:var(--accent-soft); }
.btn-sun { background:var(--sun); color:var(--sun-ink); }
.btn-sun:hover { filter:brightness(1.05); }
.btn-sm { padding:9px 14px; font-size:.9rem; border-radius:12px; }

/* ---------- Sonuçlar ---------- */
.results-bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:16px; }
.tabs { display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:4px; margin-right:auto; }
.tabs button { border:0; background:transparent; padding:8px 16px; border-radius:10px; font-weight:700; color:var(--muted); }
.tabs button[aria-selected="true"] { background:var(--accent); color:var(--accent-ink); }
.results-bar select { height:40px; border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:0 10px; }
.check { display:inline-flex; align-items:center; gap:8px; font-size:.9rem; font-weight:600; }
.check input { width:18px; height:18px; accent-color:var(--accent); }

.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:18px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow); text-align:left; padding:0; color:inherit; transition:transform .18s ease, border-color .18s ease; }
.card:hover { transform:translateY(-3px); border-color:var(--accent); }
.card-hero { position:relative; height:128px; display:grid; place-items:center; font-size:3.6rem; background:linear-gradient(135deg, hsl(var(--h) 55% var(--tl1)), hsl(calc(var(--h) + 40) 60% var(--tl2))); }
.fav-btn { position:absolute; top:10px; right:10px; width:38px; height:38px; border-radius:50%; border:0; background:rgba(255,255,255,.88); color:#B33A3A; font-size:1.15rem; display:grid; place-items:center; }
:root[data-theme="dark"] .fav-btn { background:rgba(13,22,18,.7); color:#FF9B8A; }
.ring { position:absolute; left:10px; top:10px; width:42px; height:42px; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--p) * 1%), rgba(255,255,255,.55) 0); display:grid; place-items:center; }
.ring span { width:32px; height:32px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-size:.72rem; font-weight:800; color:var(--ink); }
.card-body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; flex:1; }
.card h3 { font-size:1.08rem; font-weight:800; }
.card .desc { color:var(--muted); font-size:.88rem; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.meta { display:flex; flex-wrap:wrap; gap:6px 12px; color:var(--muted); font-size:.84rem; font-weight:600; margin-top:auto; }
.badge { border-radius:10px; padding:6px 10px; font-size:.82rem; font-weight:600; }
.badge-ok { background:var(--ok-bg); color:var(--ok-ink); }
.badge-warn { background:var(--warn-bg); color:var(--warn-ink); }

.state { text-align:center; padding:56px 20px; color:var(--muted); background:var(--surface); border:1.5px dashed var(--line); border-radius:20px; }
.state .big { font-size:3rem; }
.state h2 { color:var(--ink); font-size:1.3rem; margin:8px 0 6px; }
.state p { margin:0 auto 16px; max-width:46ch; }
.state.error h2 { color:var(--bad); }
.more { text-align:center; margin-top:26px; }

.skeleton { height:290px; border-radius:var(--radius); border:1px solid var(--line); background:linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size:300% 100%; animation:shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position:100% 0; } to { background-position:0 0; } }
.spinner { width:18px; height:18px; border:3px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ---------- Katmanlar ---------- */
.overlay { position:fixed; inset:0; z-index:50; background:rgba(5,12,9,.66); display:flex; justify-content:center; align-items:center; padding:16px; }
.sheet { background:var(--surface); border-radius:22px; width:100%; max-width:720px; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 30px 80px -20px rgba(0,0,0,.6); overflow:hidden; }
.sheet-head { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); }
.sheet-head h2 { font-size:1.35rem; font-weight:800; flex:1; min-width:0; }
.sheet-body { padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:20px; }
.sheet-foot { padding:14px 20px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; background:var(--surface-2); }
.sheet-foot .btn { flex:1 1 auto; }
.x { border:0; background:var(--surface-2); width:40px; height:40px; border-radius:50%; font-size:1.4rem; line-height:1; flex:none; }
.x:hover { background:var(--accent-soft); }
.drawer { justify-content:flex-end; align-items:stretch; padding:0; }
.drawer .sheet { max-width:420px; max-height:none; height:100%; border-radius:22px 0 0 22px; }
@media (max-width:520px){ .drawer .sheet { border-radius:0; } }

.recipe-hero { display:flex; align-items:center; gap:16px; padding:18px; border-radius:16px; background:linear-gradient(135deg, hsl(var(--h) 55% var(--tl1)), hsl(calc(var(--h) + 40) 60% var(--tl2))); }
.recipe-hero .e { font-size:3.2rem; line-height:1; }
.recipe-hero p { margin:0; font-size:.98rem; }
.facts { display:flex; flex-wrap:wrap; gap:8px; }
.fact { background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:6px 12px; font-size:.86rem; font-weight:600; }
.fact b { font-weight:800; }
.sec-title { font-size:1.15rem; font-weight:800; display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.sec-title .grow { flex:1; }
.ing-list { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.ing-list li { display:flex; gap:10px; align-items:baseline; padding:8px 12px; border-radius:10px; background:var(--surface-2); }
.ing-list .mark { font-weight:800; width:1.1em; flex:none; }
.ing-list li.have .mark { color:var(--accent); }
.ing-list li.lack { background:var(--warn-bg); color:var(--warn-ink); }
.ing-list li.lack .mark { color:var(--bad); }
.steps { list-style:none; margin:0; padding:0; display:grid; gap:12px; counter-reset:s; }
.steps li { counter-increment:s; display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:start; }
.steps li::before { content:counter(s); width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-weight:800; display:grid; place-items:center; }
.steps .t { max-width:64ch; }
.steps .tm { display:inline-block; margin-top:4px; font-size:.8rem; font-weight:700; color:var(--muted); }
.tip { background:var(--accent-soft); border-radius:12px; padding:12px 14px; }
.scaler { display:inline-flex; align-items:center; gap:4px; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; }
.scaler button { width:32px; height:32px; border:0; background:var(--surface-2); font-weight:800; }
.scaler output { min-width:76px; text-align:center; font-size:.85rem; font-weight:700; }

/* Alışveriş listesi */
.shop-list { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.shop-list li { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--surface-2); border-radius:10px; }
.shop-list input { width:18px; height:18px; accent-color:var(--accent); }
.shop-list label { flex:1; }
.shop-list li.done label { text-decoration:line-through; color:var(--muted); }
.shop-list .rm { border:0; background:transparent; color:var(--muted); font-size:1.1rem; }

/* Ayarlar */
.form-row { display:flex; flex-direction:column; gap:6px; }
.form-row label { font-weight:700; }
.form-row input { height:44px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); padding:0 12px; }

/* Pişirme modu */
.cook { background:var(--bg); padding:0; align-items:stretch; z-index:60; }
.cook-inner { width:100%; max-width:900px; margin:0 auto; display:flex; flex-direction:column; padding:18px 20px 24px; gap:18px; }
.cook-top { display:flex; align-items:center; gap:12px; }
.cook-top h2 { flex:1; font-size:1.2rem; }
.progress { height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
.progress i { display:block; height:100%; background:var(--accent); transition:width .3s ease; }
.cook-step { flex:1; display:flex; flex-direction:column; justify-content:center; gap:20px; }
.cook-step .n { color:var(--muted); font-weight:700; }
.cook-step p { font-family:var(--font-display); font-weight:600; font-size:clamp(1.5rem, 4.2vw, 2.4rem); line-height:1.3; margin:0; max-width:30ch; }
.timer { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.timer .time { font-family:var(--font-display); font-size:2.6rem; font-weight:800; font-variant-numeric:tabular-nums; }
.cook-nav { display:grid; grid-template-columns:1fr 2fr; gap:12px; }
.cook-nav .btn { padding:18px; font-size:1.1rem; }

/* Toast */
.toasts { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:100; display:grid; gap:8px; width:min(92vw, 420px); pointer-events:none; }
.toast { background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:12px; font-weight:600; box-shadow:var(--shadow); animation:pop .2s ease; }
@keyframes pop { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
@media print {
  body > *:not(#recipe-modal) { display:none !important; }
  #recipe-modal { position:static; background:#fff; padding:0; display:block; }
  #recipe-modal .sheet { max-height:none; box-shadow:none; color:#000; }
  .sheet-foot, .x, .scaler button, .fav-btn { display:none !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">🍳</div>
    <div>
      <h1 data-i18n="appTitle">Mutfak Asistanı</h1>
      <p data-i18n="tagline"></p>
    </div>
  </div>
  <div class="tools">
    <button class="icon-btn" id="btn-shop" aria-label="Shopping list"><span aria-hidden="true">🛒</span><span class="count" id="shop-count" hidden>0</span></button>
    <button class="icon-btn" id="btn-lang" aria-label="Language">TR / EN</button>
    <button class="icon-btn" id="btn-theme" aria-label="Theme"><span id="theme-icon" aria-hidden="true">🌙</span></button>
    <button class="icon-btn" id="btn-settings" aria-label="Settings"><span aria-hidden="true">⚙️</span></button>
  </div>
</header>

<main class="layout">
  <!-- Sol panel: tercihler -->
  <aside class="panel" aria-label="Preferences">
    <section>
      <h2 class="field-title" data-i18n="pantryTitle"></h2>
      <div class="chipbox" id="chipbox">
        <div id="chips" style="display:contents"></div>
        <input id="ing-input" type="text" autocomplete="off" data-i18n-ph="pantryPh" aria-label="Ingredient">
      </div>
      <div class="quick" id="quick" aria-label="Quick add"></div>
    </section>

    <section>
      <h2 class="field-title" data-i18n="cuisineTitle"></h2>
      <div class="toggles" id="cuisines"></div>
    </section>

    <section>
      <h2 class="field-title" data-i18n="dietTitle"></h2>
      <div class="toggles" id="diets"></div>
    </section>

    <section class="options">
      <label><span data-i18n="timeLabel"></span>
        <select id="opt-time">
          <option value="0" data-i18n="any"></option>
          <option value="15">≤ 15</option>
          <option value="30">≤ 30</option>
          <option value="60">≤ 60</option>
        </select>
      </label>
      <label><span data-i18n="diffLabel"></span>
        <select id="opt-diff">
          <option value="" data-i18n="any"></option>
          <option value="easy" data-i18n="easy"></option>
          <option value="medium" data-i18n="medium"></option>
        </select>
      </label>
      <label><span data-i18n="servingsLabel"></span>
        <div class="stepper">
          <button type="button" id="srv-minus" aria-label="−">−</button>
          <output id="srv-out">2</output>
          <button type="button" id="srv-plus" aria-label="+">+</button>
        </div>
      </label>
      <label><span data-i18n="countLabel"></span>
        <select id="opt-count">
          <option value="6">6</option>
          <option value="9">9</option>
          <option value="12">12</option>
        </select>
      </label>
    </section>

    <button class="btn btn-primary" id="btn-find"><span data-i18n="find"></span></button>
  </aside>

  <!-- Sağ: sonuçlar -->
  <section aria-live="polite">
    <div class="results-bar">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-results" aria-selected="true" data-i18n="tabResults"></button>
        <button role="tab" id="tab-fav" aria-selected="false"><span data-i18n="tabFav"></span> <span id="fav-count"></span></button>
      </div>
      <label class="check"><input type="checkbox" id="only-complete"><span data-i18n="onlyComplete"></span></label>
      <select id="sort" aria-label="Sort">
        <option value="match" data-i18n="sortMatch"></option>
        <option value="time" data-i18n="sortTime"></option>
        <option value="kcal" data-i18n="sortKcal"></option>
      </select>
    </div>
    <div id="status"></div>
    <div class="grid" id="grid"></div>
    <div class="more" id="more" hidden><button class="btn btn-ghost" id="btn-more"><span data-i18n="more"></span></button></div>
  </section>
</main>

<!-- Tarif penceresi -->
<div class="overlay" id="recipe-modal" role="dialog" aria-modal="true" aria-labelledby="m-title" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="m-title"></h2>
      <button class="x" data-close aria-label="Close">&times;</button>
    </div>
    <div class="sheet-body" id="m-body"></div>
    <div class="sheet-foot" id="m-foot"></div>

/* =====================================================================
   Yardımcılar

const $ = (s, r = document) => r.querySelector(s);
const NATIVE = window.Android || null; // Android uygulamasında yerel köprü
const store = {
  get(k, d) { try { const v = localStorage.getItem('kitchen.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('kitchen.' + k, JSON.stringify(v)); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hue = str => { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const slug = s => String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '');

let lang = store.get('lang', (navigator.language || 'tr').toLowerCase().startsWith('tr') ? 'tr' : 'en');
const t = (k, v = {}) => {
  let s = (I18N[lang][k] ?? I18N.en[k] ?? k);
  if (typeof s !== 'string') return s;
  for (const key in v) s = s.replace('{' + key + '}', v[key]);
  return s;
};

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function fmtAmt(n) {
  if (!(n > 0)) return '';
  if (n >= 10) return String(Math.round(n));
  const w = Math.floor(n), f = n - w;
  const opts = [[0,''],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
  let best = opts[0];
  for (const o of opts) if (Math.abs(o[0] - f) < Math.abs(best[0] - f)) best = o;
  const W = best[0] === 1 ? w + 1 : w;
  return (W > 0 ? W : '') + best[1] || String(Math.round(n * 100) / 100);
}

/* =====================================================================
   Durum
   ===================================================================== */
let pantry = store.get('pantry', []);
let selCuisines = store.get('cuisines', []);
let selDiets = store.get('diets', []);
let prefs = Object.assign({ time: 0, diff: '', servings: 2, count: 6 }, store.get('prefs', {}));
let settings = Object.assign({ key: '', model: 'gemini-3.5-flash-lite' }, store.get('settings', {}));
let favs = store.get('favs', []);
let shop = store.get('shop', []);
let recipes = [];
let view = 'results';
let busy = false;
let lastError = null;
let current = null, currentServings = 2;

/* =====================================================================
   Çeviri uygulama + sabit arayüz parçaları
   ===================================================================== */
function applyI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $('#btn-lang').textContent = lang === 'tr' ? 'TR · en' : 'tr · EN';
  renderQuick(); renderCuisines(); renderDiets(); renderChips();
}

function renderChips() {
  $('#chips').innerHTML = pantry.map((p, i) =>
    `<span class="chip">${esc(p)}<button type="button" data-rm="${i}" aria-label="Remove ${esc(p)}">&times;</button></span>`).join('');
}
function addIngredients(raw) {
  raw.split(/[,;\n]/).map(s => s.trim()).filter(Boolean).forEach(s => {
    if (!pantry.some(p => p.toLowerCase() === s.toLowerCase())) pantry.push(s);
  });
  store.set('pantry', pantry); renderChips(); renderQuick();
}
function renderQuick() {
  $('#quick').innerHTML = t('quick').filter(q => !pantry.some(p => p.toLowerCase() === q.toLowerCase()))
    .map(q => `<button type="button" data-q="${esc(q)}">+ ${esc(q)}</button>`).join('');
}
function renderCuisines() {
  $('#cuisines').innerHTML = CUISINES.map(([k, f]) =>
    `<button type="button" class="toggle" data-cuisine="${k}" aria-pressed="${selCuisines.includes(k)}"><span class="flag" aria-hidden="true">${f}</span>${esc(t('cuisine')[k])}</button>`).join('');
}
function renderDiets() {
  $('#diets').innerHTML = DIETS.map(d =>
    `<button type="button" class="toggle" data-diet="${d}" aria-pressed="${selDiets.includes(d)}">${esc(t('diet')[d])}</button>`).join('');
}

/* =====================================================================
   Tarif verisi
   ===================================================================== */
function normalize(r) {
  const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : d; };
  const cuisine = CUISINES.some(c => c[0] === r.cuisine) ? r.cuisine : 'Other';
  const out = {
    name: String(r.name || '').trim(),
    cuisine,
    emoji: String(r.emoji || '🍲').slice(0, 8),
    description: String(r.description || ''),
    prep: Math.round(num(r.prepMinutes)), cook: Math.round(num(r.cookMinutes)),
    difficulty: ['easy','medium','hard'].includes(r.difficulty) ? r.difficulty : 'medium',
    servings: Math.max(1, Math.round(num(r.servings, 2))),
    calories: Math.round(num(r.calories)),
    ingredients: (Array.isArray(r.ingredients) ? r.ingredients : []).map(i => ({
      name: String(i.name || '').trim(), amount: num(i.amount), unit: String(i.unit || '').trim(), have: i.have !== false
    })).filter(i => i.name),
    steps: (Array.isArray(r.steps) ? r.steps : []).map(s => typeof s === 'string' ? { text: s, minutes: 0 } : ({ text: String(s.text || '').trim(), minutes: Math.round(num(s.minutes)) })).filter(s => s.text),
    tip: String(r.tip || '')
  };
  out.id = slug(out.name) + '-' + out.cuisine;
  return out;
}
const missingOf = r => r.ingredients.filter(i => !i.have);
const matchOf = r => r.ingredients.length ? Math.round(100 * (r.ingredients.length - missingOf(r).length) / r.ingredients.length) : 0;
const totalMin = r => r.prep + r.cook;
const isFav = r => favs.some(f => f.id === r.id);

/* =====================================================================
   Gemini isteği
   ===================================================================== */
class AppError extends Error { constructor(code, status) { super(code); this.code = code; this.status = status; } }

function buildPrompt(exclude) {
  const cuisinesTxt = selCuisines.length ? selCuisines.join(', ') : 'any cuisine, be creative and varied';
  const dietTxt = selDiets.length ? selDiets.join(', ') + ' (strict: never include anything that violates these)' : 'none';
  return `Create ${prefs.count} distinct, realistic home-cooking recipes. Write every text value in ${t('aiLang')}.

Cook's situation:
- Cuisine: ${cuisinesTxt}
- Ingredients on hand: ${pantry.join(', ')}
- Salt, black pepper, cooking oil and water are always available: mark them have=true.
- Dietary requirements: ${dietTxt}
- Maximum total time (prep + cook): ${prefs.time ? prefs.time + ' minutes' : 'no limit'}
- Difficulty: ${prefs.diff || 'any'}
- Base servings: ${prefs.servings}

Rules:
- Build mostly on the ingredients on hand; at most 3 ingredients may be missing (have=false).
- "cuisine" must be exactly one of: ${CUISINES.map(c => c[0]).join(', ')}, Other.
- Each ingredient has name, amount (number, 0 if "to taste"), unit (short like g, ml, tbsp, tsp, piece; empty if none) and have.
- Each step is one clear action; "minutes" is the waiting/cooking time of that step in whole minutes, 0 if none.
- "emoji" is one emoji that represents the dish. "calories" is the estimated kcal per serving.
- "description" is one appetizing sentence. "tip" is one short practical tip.${exclude.length ? '\n- Do NOT repeat these recipes: ' + exclude.join(', ') + '.' : ''}`;
}

const RECIPE_SCHEMA = {
  type: 'OBJECT',
  properties: { recipes: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
    name: { type: 'STRING' }, cuisine: { type: 'STRING' }, emoji: { type: 'STRING' }, description: { type: 'STRING' },
    prepMinutes: { type: 'INTEGER' }, cookMinutes: { type: 'INTEGER' },
    difficulty: { type: 'STRING', enum: ['easy','medium','hard'] },
    servings: { type: 'INTEGER' }, calories: { type: 'INTEGER' },
    ingredients: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
      name: { type: 'STRING' }, amount: { type: 'NUMBER' }, unit: { type: 'STRING' }, have: { type: 'BOOLEAN' }
    }, required: ['name','amount','unit','have'] } },
    steps: { type: 'ARRAY', items: { type: 'OBJECT', properties: { text: { type: 'STRING' }, minutes: { type: 'INTEGER' } }, required: ['text','minutes'] } },
    tip: { type: 'STRING' }
  }, required: ['name','cuisine','emoji','description','prepMinutes','cookMinutes','difficulty','servings','calories','ingredients','steps','tip'] } } },
  required: ['recipes']
};

async function requestRecipes(exclude) {
  const payload = {
    contents: [{ role: 'user', parts: [{ text: buildPrompt(exclude) }] }],
    generationConfig: { responseMimeType: 'application/json', responseSchema: RECIPE_SCHEMA, temperature: 0.9 }
  };
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.model.trim())}:generateContent`;
  for (let attempt = 0; ; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 90000);
    let res;
    try {
      res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': settings.key.trim() }, body: JSON.stringify(payload), signal: ctrl.signal });
    } catch (e) {
      throw new AppError(e.name === 'AbortError' ? 'timeout' : 'network');
    } finally { clearTimeout(timer); }

    if (res.ok) {
      try {
        const data = await res.json();
        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
        return (parsed.recipes || []).map(normalize).filter(r => r.name && r.ingredients.length && r.steps.length);
      } catch { throw new AppError('parse'); }
    }
    if ((res.status === 429 || res.status >= 500) && attempt < 2) { await sleep(1500 * (attempt + 1)); continue; }
    const body = await res.text().catch(() => '');
    if (res.status === 401 || res.status === 403 || /API key/i.test(body)) throw new AppError('badKey', res.status);
    if (res.status === 429) throw new AppError('rate', res.status);
    console.error('API error', res.status, body);
    throw new AppError('generic', res.status);
  }
}

async function findRecipes(append = false) {
  if (busy) return;
  if (!pantry.length) { toast(t('noIng')); $('#ing-input').focus(); return; }
  if (!settings.key.trim()) { toast(t('err_noKey')); openOverlay($('#settings-modal')); return; }
  busy = true; view = 'results'; lastError = null;
  syncTabs();
  $('#btn-find').disabled = true;
  if (!append) { recipes = []; render(); }
  const moreBtn = $('#btn-more');
  if (append) { moreBtn.disabled = true; moreBtn.innerHTML = `<span class="spinner"></span> ${esc(t('loadingMore'))}`; }
  try {
    const list = await requestRecipes(append ? recipes.map(r => r.name) : []);
    const seen = new Set(recipes.map(r => r.id));
    recipes.push(...list.filter(r => !seen.has(r.id)));
    if (!recipes.length) lastError = 'empty';
  } catch (e) {
    if (append) toast(t('err_' + e.code) + (e.status ? ` (${e.status})` : ''));
    else lastError = e.code + (e.status ? ':' + e.status : '');
  } finally {
    busy = false; $('#btn-find').disabled = false;
    moreBtn.disabled = false; moreBtn.innerHTML = `<span>${esc(t('more'))}</span>`;
    render();
  }
}

/* =====================================================================
   Sonuç listesi
   ===================================================================== */
function syncTabs() {
  $('#tab-results').setAttribute('aria-selected', view === 'results');
  $('#tab-fav').setAttribute('aria-selected', view === 'fav');
  $('#fav-count').textContent = favs.length ? `(${favs.length})` : '';
}

function visible() {
  let list = (view === 'fav' ? favs : recipes).slice();
  if ($('#only-complete').checked) list = list.filter(r => missingOf(r).length === 0);
  const s = $('#sort').value;
  if (s === 'match') list.sort((a, b) => matchOf(b) - matchOf(a) || totalMin(a) - totalMin(b));
  if (s === 'time') list.sort((a, b) => totalMin(a) - totalMin(b));
  if (s === 'kcal') list.sort((a, b) => (a.calories || 9999) - (b.calories || 9999));
  return list;
}

function stateBox(icon, title, text, extra = '', cls = '') {
  return `<div class="state ${cls}"><div class="big" aria-hidden="true">${icon}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${extra}</div>`;
}

function render() {
  syncTabs();
  const grid = $('#grid'), status = $('#status'), more = $('#more');
  status.innerHTML = ''; grid.innerHTML = ''; more.hidden = true;

  if (busy && view === 'results' && !recipes.length) {
    grid.innerHTML = Array.from({ length: Number(prefs.count) }, () => '<div class="skeleton"></div>').join('');
    return;
  }
  if (view === 'results' && lastError && !recipes.length) {
    if (lastError === 'empty') { status.innerHTML = stateBox('🥣', t('noMatchTitle'), t('noMatchText')); return; }
    const [code, st] = lastError.split(':');
    status.innerHTML = stateBox('⚠️', t('errorTitle'), t('err_' + code) + (st ? ` (${st})` : ''), `<button class="btn btn-primary btn-sm" id="btn-retry">${esc(t('retry'))}</button>`, 'error');
    return;
  }
  const source = view === 'fav' ? favs : recipes;
  if (!source.length) {
    status.innerHTML = view === 'fav' ? stateBox('💚', t('favEmptyTitle'), t('favEmptyText')) : stateBox('🥕', t('emptyTitle'), t('emptyText'));
    return;
  }
  const list = visible();
  if (!list.length) { status.innerHTML = stateBox('🔎', t('filteredTitle'), t('filteredText')); return; }
  grid.innerHTML = list.map(cardHtml).join('');
  more.hidden = view !== 'results';
}

function cardHtml(r) {
  const miss = missingOf(r), pct = matchOf(r);
  return `<article class="card" data-id="${esc(r.id)}" tabindex="0" role="button" aria-label="${esc(r.name)}">
    <div class="card-hero" style="--h:${hue(r.name)}">
      <div class="ring" style="--p:${pct}" title="${esc(t('match', { n: pct }))}"><span>${pct}</span></div>
      <button class="fav-btn" data-fav="${esc(r.id)}" aria-label="Favorite" aria-pressed="${isFav(r)}">${isFav(r) ? '♥' : '♡'}</button>
      <span aria-hidden="true">${esc(r.emoji)}</span>
    </div>
    <div class="card-body">
      <h3>${esc(r.name)}</h3>
      <p class="desc">${esc(r.description)}</p>
      <div class="badge ${miss.length ? 'badge-warn' : 'badge-ok'}">${miss.length ? '⚠️ ' + esc(t('missing', { n: miss.length })) + ': ' + esc(miss.map(m => m.name).join(', ')) : '✅ ' + esc(t('ready'))}</div>
      <div class="meta"><span>⏱ ${totalMin(r)} ${esc(t('min'))}</span><span>${esc(t(r.difficulty))}</span>${r.calories ? `<span>🔥 ${r.calories} ${esc(t('kcal'))}</span>` : ''}</div>
    </div>
  </article>`;
}

function findById(id) { return recipes.find(r => r.id === id) || favs.find(r => r.id === id); }

function toggleFav(id) {
  const r = findById(id); if (!r) return;
  if (isFav(r)) { favs = favs.filter(f => f.id !== id); toast(t('favRemoved')); }
  else { favs.unshift(r); toast(t('favAdded')); }
  store.set('favs', favs);
  render();
  if (current && current.id === id) renderModal();
}

/* =====================================================================
   Tarif penceresi
   ===================================================================== */
const stack = [];
function openOverlay(el) {
  el.hidden = false; stack.push(el);
  document.body.style.overflow = 'hidden';
  (el.querySelector('input, [data-close]') || el).focus?.();
}
function closeOverlay(el) {
  el.hidden = true;
  const i = stack.indexOf(el); if (i > -1) stack.splice(i, 1);
  if (!stack.length) document.body.style.overflow = '';
  if (el.id === 'cook') stopCook();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && stack.length) closeOverlay(stack[stack.length - 1]);
  if (!$('#cook').hidden) {
    if (e.key === 'ArrowRight') $('#c-next').click();
    if (e.key === 'ArrowLeft') $('#c-prev').click();
  }
});
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) closeOverlay(ov); });
});

function openRecipe(id) {
  const r = findById(id); if (!r) return;
  current = r; currentServings = r.servings;
  renderModal();
  openOverlay($('#recipe-modal'));
}

function ingredientLine(i, factor) {
  return [fmtAmt(i.amount * factor), i.unit, i.name].filter(Boolean).join(' ');
}

function renderModal() {
  const r = current; if (!r) return;
  const factor = currentServings / r.servings, miss = missingOf(r);
  $('#m-title').textContent = r.name;
  $('#m-body').innerHTML = `
    <div class="recipe-hero" style="--h:${hue(r.name)}"><span class="e" aria-hidden="true">${esc(r.emoji)}</span><p>${esc(r.description)}</p></div>
    <div class="facts">
      <span class="fact">${esc(t('prep'))}: <b>${r.prep} ${esc(t('min'))}</b></span>
      <span class="fact">${esc(t('cook'))}: <b>${r.cook} ${esc(t('min'))}</b></span>
      <span class="fact">${esc(t('difficulty'))}: <b>${esc(t(r.difficulty))}</b></span>
      ${r.calories ? `<span class="fact"><b>${r.calories}</b> ${esc(t('kcal'))} / ${esc(t('perServing'))}</span>` : ''}
      <span class="fact">${esc(t('match', { n: matchOf(r) }))}</span>
    </div>
    <section>
      <div class="sec-title"><span class="grow">${esc(t('ingredients'))}</span>
        <span class="scaler"><button type="button" data-srv="-1" aria-label="−">−</button><output>${esc(t('servingsFor', { n: currentServings }))}</output><button type="button" data-srv="1" aria-label="+">+</button></span>
      </div>
      <ul class="ing-list">${r.ingredients.map(i => `<li class="${i.have ? 'have' : 'lack'}"><span class="mark" aria-hidden="true">${i.have ? '✓' : '✕'}</span><span>${esc(ingredientLine(i, factor))}</span></li>`).join('')}</ul>
    </section>
    <section>
      <div class="sec-title">${esc(t('steps'))}</div>
      <ol class="steps">${r.steps.map(s => `<li><div class="t">${esc(s.text)}${s.minutes ? `<br><span class="tm">⏱ ${s.minutes} ${esc(t('min'))}</span>` : ''}</div></li>`).join('')}</ol>
    </section>
    ${r.tip ? `<div class="tip"><b>💡 ${esc(t('tip'))}:</b> ${esc(r.tip)}</div>` : ''}`;
  const yt = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(r.name + (lang === 'tr' ? ' tarifi' : ' recipe'));
  $('#m-foot').innerHTML = `
    <button class="btn btn-primary btn-sm" data-act="cook">👩‍🍳 ${esc(t('startCooking'))}</button>
    ${miss.length ? `<button class="btn btn-sun btn-sm" data-act="shop">🛒 ${esc(t('addMissing'))}</button>` : ''}
    <button class="btn btn-ghost btn-sm" data-act="fav" aria-pressed="${isFav(r)}">${isFav(r) ? '♥' : '♡'}</button>
    <button class="btn btn-ghost btn-sm" data-act="copy">${esc(t('copy'))}</button>
    <button class="btn btn-ghost btn-sm" data-act="print">${esc(t('print'))}</button>
    <a class="btn btn-ghost btn-sm" href="${yt}" target="_blank" rel="noopener">▶ ${esc(t('video'))}</a>`;
}

function recipeText(r, n) {
  const f = n / r.servings;
  return `${r.emoji} ${r.name} (${t('servingsFor', { n })})\n\n${t('ingredients')}:\n` +
    r.ingredients.map(i => '• ' + ingredientLine(i, f)).join('\n') +
    `\n\n${t('steps')}:\n` + r.steps.map((s, i) => `${i + 1}. ${s.text}`).join('\n');
}
async function copyText(text) {
  if (NATIVE) { NATIVE.copy(text); toast(t('copied')); return; }
  try { await navigator.clipboard.writeText(text); toast(t('copied')); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(t('copied')); } catch {} ta.remove();
  }
}

$('#m-body').addEventListener('click', e => {
  const b = e.target.closest('[data-srv]'); if (!b) return;
  currentServings = Math.min(24, Math.max(1, currentServings + Number(b.dataset.srv)));
  renderModal();
});
$('#m-foot').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !current) return;
  const a = b.dataset.act;
  if (a === 'cook') startCook();
  if (a === 'shop') addToShop(missingOf(current).map(i => i.name));
  if (a === 'fav') toggleFav(current.id);
  if (a === 'copy') copyText(recipeText(current, currentServings));
  if (a === 'print') { NATIVE ? NATIVE.print(current.name) : window.print(); }
});

/* =====================================================================
   Alışveriş listesi
   ===================================================================== */
function addToShop(names) {
  let added = 0;
  names.forEach(n => { if (!shop.some(s => s.name.toLowerCase() === n.toLowerCase())) { shop.push({ name: n, done: false }); added++; } });
  store.set('shop', shop); renderShop();
  toast(added ? t('addedN', { n: added }) : t('nothingNew'));
}
function renderShop() {
  const left = shop.filter(s => !s.done).length;
  const c = $('#shop-count'); c.hidden = !left; c.textContent = left;
  $('#s-body').innerHTML = shop.length
    ? `<ul class="shop-list">${shop.map((s, i) => `<li class="${s.done ? 'done' : ''}"><input type="checkbox" id="sh${i}" data-i="${i}" ${s.done ? 'checked' : ''}><label for="sh${i}">${esc(s.name)}</label><button class="rm" data-rm="${i}" aria-label="Remove">&times;</button></li>`).join('')}</ul>`
    : `<p class="hint">${esc(t('shopEmpty'))}</p>`;
}
$('#s-body').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { shop.splice(Number(rm.dataset.rm), 1); store.set('shop', shop); renderShop(); return; }
});
$('#s-body').addEventListener('change', e => {
  const cb = e.target.closest('input[data-i]'); if (!cb) return;
  shop[Number(cb.dataset.i)].done = cb.checked; store.set('shop', shop); renderShop();
});
$('#shop-copy').addEventListener('click', () => copyText(shop.map(s => (s.done ? '☑ ' : '☐ ') + s.name).join('\n')));
$('#shop-clear').addEventListener('click', () => { shop = []; store.set('shop', shop); renderShop(); });

/* =====================================================================
   Pişirme modu (adım adım + sayaç + ekran uyanık)
   ===================================================================== */
let cookStep = 0, timerId = null, timerLeft = 0, wakeLock = null, audioCtx = null;

async function startCook() {
  cookStep = 0; renderCook(); openOverlay($('#cook'));
  if (NATIVE) NATIVE.keepScreenOn(true);
  else { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
}
function stopCook() {
  stopTimer();
  if (NATIVE) NATIVE.keepScreenOn(false);
  try { wakeLock?.release(); } catch {} wakeLock = null;
}
function renderCook() {
  const r = current, s = r.steps[cookStep], last = cookStep === r.steps.length - 1;
  $('#c-title').textContent = r.emoji + ' ' + r.name;
  $('#c-n').textContent = t('step', { i: cookStep + 1, n: r.steps.length });
  $('#c-text').textContent = s.text;
  $('#c-bar').style.width = ((cookStep + 1) / r.steps.length * 100) + '%';
  $('#c-prev').disabled = cookStep === 0;
  $('#c-next').textContent = last ? '✓ ' + t('finish') : t('next');
  stopTimer();
  const tm = $('#c-timer'); tm.hidden = !s.minutes;
  if (s.minutes) { timerLeft = s.minutes * 60; paintTimer(); $('#c-timer-btn').textContent = t('startTimer', { m: s.minutes }); }
}
function paintTimer() {
  const m = String(Math.floor(timerLeft / 60)).padStart(2, '0'), s = String(timerLeft % 60).padStart(2, '0');
  $('#c-time').textContent = `${m}:${s}`;
}
function stopTimer() { clearInterval(timerId); timerId = null; }
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(d => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.2, audioCtx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + d + .25);
      o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + .3);
    });
  } catch {}
  if (NATIVE) NATIVE.vibrate(); else navigator.vibrate?.([300, 150, 300]);
}
$('#c-timer-btn').addEventListener('click', () => {
  if (timerId) { stopTimer(); $('#c-timer-btn').textContent = t('startTimer', { m: current.steps[cookStep].minutes }); return; }
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); // kullanıcı hareketiyle aç
  $('#c-timer-btn').textContent = t('stopTimer');
  timerId = setInterval(() => {
    timerLeft--; paintTimer();
    if (timerLeft <= 0) { stopTimer(); beep(); toast('⏰ ' + t('timeUp')); $('#c-timer-btn').textContent = t('startTimer', { m: current.steps[cookStep].minutes }); }
  }, 1000);
});
$('#c-prev').addEventListener('click', () => { if (cookStep > 0) { cookStep--; renderCook(); } });
$('#c-next').addEventListener('click', () => {
  if (cookStep < current.steps.length - 1) { cookStep++; renderCook(); } else closeOverlay($('#cook'));
});

/* =====================================================================
   Olaylar
   ===================================================================== */
const input = $('#ing-input');
$('#chipbox').addEventListener('click', e => { if (!e.target.closest('button')) input.focus(); });
input.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ',') && input.value.trim()) { e.preventDefault(); addIngredients(input.value); input.value = ''; }
  else if (e.key === 'Enter' && !input.value.trim()) { e.preventDefault(); findRecipes(); }
  else if (e.key === 'Backspace' && !input.value && pantry.length) { pantry.pop(); store.set('pantry', pantry); renderChips(); renderQuick(); }
});
input.addEventListener('blur', () => { if (input.value.trim()) { addIngredients(input.value); input.value = ''; } });
input.addEventListener('paste', e => {
  const txt = (e.clipboardData || window.clipboardData).getData('text');
  if (/[,;\n]/.test(txt)) { e.preventDefault(); addIngredients(txt); }
});
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('[data-rm]'); if (!b) return;
  pantry.splice(Number(b.dataset.rm), 1); store.set('pantry', pantry); renderChips(); renderQuick();
});
$('#quick').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) addIngredients(b.dataset.q); });

function toggleIn(arr, v) { const i = arr.indexOf(v); i > -1 ? arr.splice(i, 1) : arr.push(v); }
$('#cuisines').addEventListener('click', e => {
  const b = e.target.closest('[data-cuisine]'); if (!b) return;
  toggleIn(selCuisines, b.dataset.cuisine); store.set('cuisines', selCuisines); renderCuisines();
});
$('#diets').addEventListener('click', e => {
  const b = e.target.closest('[data-diet]'); if (!b) return;
  toggleIn(selDiets, b.dataset.diet); store.set('diets', selDiets); renderDiets();
});

function syncPrefs() {
  $('#opt-time').value = String(prefs.time); $('#opt-diff').value = prefs.diff;
  $('#opt-count').value = String(prefs.count); $('#srv-out').textContent = prefs.servings;
}
function savePrefs() { store.set('prefs', prefs); }
$('#opt-time').addEventListener('change', e => { prefs.time = Number(e.target.value); savePrefs(); });
$('#opt-diff').addEventListener('change', e => { prefs.diff = e.target.value; savePrefs(); });
$('#opt-count').addEventListener('change', e => { prefs.count = Number(e.target.value); savePrefs(); });
$('#srv-minus').addEventListener('click', () => { prefs.servings = Math.max(1, prefs.servings - 1); syncPrefs(); savePrefs(); });
$('#srv-plus').addEventListener('click', () => { prefs.servings = Math.min(12, prefs.servings + 1); syncPrefs(); savePrefs(); });

$('#btn-find').addEventListener('click', () => findRecipes(false));
$('#btn-more').addEventListener('click', () => findRecipes(true));
$('#status').addEventListener('click', e => { if (e.target.closest('#btn-retry')) findRecipes(false); });

$('#tab-results').addEventListener('click', () => { view = 'results'; render(); });
$('#tab-fav').addEventListener('click', () => { view = 'fav'; render(); });
$('#only-complete').addEventListener('change', render);
$('#sort').addEventListener('change', render);

$('#grid').addEventListener('click', e => {
  const fav = e.target.closest('[data-fav]');
  if (fav) { e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
  const card = e.target.closest('.card'); if (card) openRecipe(card.dataset.id);
});
$('#grid').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) { e.preventDefault(); openRecipe(e.target.dataset.id); }
});

$('#btn-shop').addEventListener('click', () => { renderShop(); openOverlay($('#shop-modal')); });
$('#btn-settings').addEventListener('click', () => {
  $('#set-key').value = settings.key; $('#set-model').value = settings.model; openOverlay($('#settings-modal'));
});
$('#set-save').addEventListener('click', () => {
  settings.key = $('#set-key').value.trim();
  settings.model = $('#set-model').value.trim() || 'gemini-3.5-flash-lite';
  store.set('settings', settings); closeOverlay($('#settings-modal')); toast(t('saved'));
});

function paintTheme() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#theme-icon').textContent = dark ? '☀️' : '🌙';
}
$('#btn-theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('theme', next); paintTheme();
});
$('#btn-lang').addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr'; store.set('lang', lang);
  applyI18n(); render(); renderShop();
  if (current && !$('#recipe-modal').hidden) renderModal();
});

// Android geri tuşu: açık pencere varsa onu kapatır
window.androidBack = () => { if (stack.length) { closeOverlay(stack[stack.length - 1]); return true; } return false; };

/* =====================================================================
   Başlat
   ===================================================================== */
syncPrefs(); paintTheme(); applyI18n(); render(); renderShop();
</script>
</body>
</html>
