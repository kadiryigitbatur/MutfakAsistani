   ===================================================================== */
/* =====================================================================
   Günlük hatırlatma (Android bildirimi)
   ===================================================================== */
function bestSuggestion() {
  const pool = [...recipes, ...favs, ...((plan || []))].filter(r => r && r.ingredients && !cooked.slice(0, 5).some(c => c.id === r.id));
  const ready = pool.filter(r => missingOf(r).length === 0).sort((a, b) => totalMin(a) - totalMin(b));
  const r = ready[0] || pool[0]; if (!r) return null;
  const have = r.ingredients.filter(i => i.have).slice(0, 2).map(i => i.name).join(' ' + (lang === 'tr' ? 've' : 'and') + ' ');
  return { id: r.id, text: t('remindSmart', { a: have, m: totalMin(r), r: r.name }), recipe: r };
}
function syncReminder() {
  const soon = soonItems(), sug = bestSuggestion();
  if (sug) store.set('suggestion', sug.recipe);
  let body = sug ? sug.text : t('remindBody');
  if (soon.length) body = t('remindSoon', { list: soon.join(', ') }) + ' · ' + body;
  if (NATIVE && NATIVE.setReminder) NATIVE.setReminder(!!remind.on, remind.time || '17:00', t('appTitle'), body, sug ? sug.id : '');
  if (NATIVE && NATIVE.setWidget) NATIVE.setWidget(sug ? sug.text : t('remindBody'), sug ? sug.id : '');
}
// Bildirimden / widget'tan gelen tarif kimliği
window.openFromNative = id => {
  if (!id) return;
  if (!findById(id)) { const s = store.get('suggestion', null); if (s && s.id === id) recipes.unshift(s); }
  if (findById(id)) openRecipe(id);
};
window.onReminderDenied = () => { remind.on = false; store.set('remind', remind); $('#rem-on').checked = false; toast(t('remindNA')); };
$('#rem-on').addEventListener('change', e => { remind.on = e.target.checked; store.set('remind', remind); syncReminder(); });
$('#rem-time').addEventListener('change', e => { remind.time = e.target.value || '17:00'; store.set('remind', remind); syncReminder(); });

/* =====================================================================
   Pro: aile profilleri
   ===================================================================== */
function renderFamily() {
  $('#fam').innerHTML = family.map((f, i) => `<div class="row"><input type="text" data-fn="${i}" value="${esc(f.name)}" placeholder="${esc(t('famName'))}" style="flex:.5"><input type="text" data-fx="${i}" value="${esc(f.notes)}" placeholder="${esc(t('famNotes'))}"><button type="button" class="rm" data-fr="${i}" aria-label="Remove">&times;</button></div>`).join('');
}
$('#fam-add').addEventListener('click', () => { if (!requirePro('proLockFeature')) return; family.push({ name: '', notes: '' }); store.set('family', family); renderFamily(); $('#fam input[data-fn="' + (family.length - 1) + '"]').focus(); });
$('#fam').addEventListener('input', e => {
  const n = e.target.closest('[data-fn]'), x = e.target.closest('[data-fx]');
  if (n) family[Number(n.dataset.fn)].name = n.value.slice(0, 40); if (x) family[Number(x.dataset.fx)].notes = x.value.slice(0, 160);
  store.set('family', family);
});
$('#fam').addEventListener('click', e => { const r = e.target.closest('[data-fr]'); if (!r) return; family.splice(Number(r.dataset.fr), 1); store.set('family', family); renderFamily(); });

function backupText() {
  return JSON.stringify({ app: 'mutfak-asistani', v: 2, at: new Date().toISOString(), favs, shop, pantry, pantrySets, prefs, cuisines: selCuisines, diets: selDiets, plan, expiry, leftovers, cooked, family, planOpts, dislikes, city, guest });
}
$('#bk-export').addEventListener('click', () => {
  if (!requirePro('proLockFeature')) return;
  const txt = backupText();
  if (NATIVE && NATIVE.share) NATIVE.share('Mutfak Asistanı backup', txt); else copyText(txt).then(() => toast(t('backupCopied')));
});
$('#bk-import').addEventListener('click', () => {
  if (!requirePro('proLockFeature')) return;
  const ta = $('#bk-text');
  if (ta.hidden) { ta.hidden = false; ta.placeholder = t('backupPaste'); ta.focus(); return; }
  try {
    const d = JSON.parse(ta.value); if (d.app !== 'mutfak-asistani') throw 0;
    favs = Array.isArray(d.favs) ? d.favs : favs; shop = Array.isArray(d.shop) ? d.shop : shop; pantry = Array.isArray(d.pantry) ? d.pantry : pantry;
    pantrySets = Array.isArray(d.pantrySets) ? d.pantrySets : pantrySets; prefs = Object.assign(prefs, d.prefs || {});
    selCuisines = Array.isArray(d.cuisines) ? d.cuisines : selCuisines; selDiets = Array.isArray(d.diets) ? d.diets : selDiets; plan = Array.isArray(d.plan) ? d.plan : plan;
    expiry = d.expiry && typeof d.expiry === 'object' ? d.expiry : expiry; leftovers = Array.isArray(d.leftovers) ? d.leftovers : leftovers; cooked = Array.isArray(d.cooked) ? d.cooked : cooked; family = Array.isArray(d.family) ? d.family : family; planOpts = d.planOpts || planOpts;
    store.set('expiry', expiry); store.set('leftovers', leftovers); store.set('cooked', cooked); store.set('family', family); store.set('planOpts', planOpts); renderFamily();
    dislikes = Array.isArray(d.dislikes) ? d.dislikes : dislikes; city = d.city || city; guest = d.guest || guest; store.set('dislikes', dislikes); store.set('city', city); store.set('guest', guest);
    ['favs','shop','pantry','pantrySets','prefs','plan'].forEach(k => store.set(k, { favs, shop, pantry, pantrySets, prefs, plan }[k]));
    store.set('cuisines', selCuisines); store.set('diets', selDiets);
    ta.hidden = true; ta.value = ''; applyI18n(); syncPrefs(); render(); renderShop(); renderSets(); toast(t('backupDone'));
  } catch { toast(t('backupBad')); }
});
$('#m-foot').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !current) return;
  const a = b.dataset.act;
  if (a === 'cook') startCook();
  if (a === 'shop') addToShop(missingOf(current).map(i => i.name));
  if (a === 'fav') toggleFav(current.id);
  if (a === 'copy') copyText(recipeText(current, currentServings));
  if (a === 'card') shareCard(current);
  if (a === 'challenge') shareChallenge(current);
  if (a === 'photo') cookedPhoto(current);
  if (a === 'dislike') { if (dislikes.includes(current.name)) dislikes = dislikes.filter(d => d !== current.name); else { dislikes.unshift(current.name); dislikes = dislikes.slice(0, 30); toast(t('disliked')); } store.set('dislikes', dislikes); renderModal(); }
  if (a === 'print') { NATIVE ? NATIVE.print(current.name) : window.print(); }
});

/* =====================================================================
   Alışveriş listesi
   ===================================================================== */
function addToShop(names) {
  let added = 0;
  names.forEach(n => { if (!shop.some(s => s.name.toLowerCase() === n.toLowerCase())) { shop.push({ name: n, done: false }); added++; } });
  store.set('shop', shop); renderShop();
  toast(added ? t('addedN', { n: added }) : t('nothingNew'));
}
function renderShop() {
  const left = shop.filter(s => !s.done).length;
  const c = $('#shop-count'); c.hidden = !left; c.textContent = left;
  $('#s-body').innerHTML = shop.length
    ? `<ul class="shop-list">${shop.map((s, i) => `<li class="${s.done ? 'done' : ''}"><input type="checkbox" id="sh${i}" data-i="${i}" ${s.done ? 'checked' : ''}><label for="sh${i}">${esc(s.name)}</label><button class="rm" data-rm="${i}" aria-label="Remove">&times;</button></li>`).join('')}</ul>`
    : `<p class="hint">${esc(t('shopEmpty'))}</p>`;
}
$('#s-body').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { shop.splice(Number(rm.dataset.rm), 1); store.set('shop', shop); renderShop(); return; }
});
$('#s-body').addEventListener('change', e => {
  const cb = e.target.closest('input[data-i]'); if (!cb) return;
  const it = shop[Number(cb.dataset.i)]; it.done = cb.checked; store.set('shop', shop); renderShop();
  if (cb.checked && !pantry.some(p => p.toLowerCase() === it.name.toLowerCase())) { pantry.push(it.name); store.set('pantry', pantry); renderChips(); renderQuick(); toast(t('shopToPantry', { n: it.name })); }
});
$('#shop-copy').addEventListener('click', () => copyText(shop.map(s => (s.done ? '☑ ' : '☐ ') + s.name).join('\n')));
$('#shop-clear').addEventListener('click', () => { shop = []; store.set('shop', shop); renderShop(); });

/* =====================================================================
   Pişirme modu (adım adım + sayaç + ekran uyanık)
   ===================================================================== */
let cookStep = 0, timerId = null, timerLeft = 0, wakeLock = null, audioCtx = null;

async function startCook() {
  cookStep = 0; renderCook(); openOverlay($('#cook'));
  $('#cook-voice').hidden = !(NATIVE && NATIVE.startVoice) && !('speechSynthesis' in window);
  if (NATIVE) NATIVE.keepScreenOn(true);
  else { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
}
function stopCook() {
  stopTimer(); if (voiceOn) setVoice(false);
  if (NATIVE) NATIVE.keepScreenOn(false);
  try { wakeLock?.release(); } catch {} wakeLock = null;
}
function renderCook() {
  const r = current, s = r.steps[cookStep], last = cookStep === r.steps.length - 1;
  $('#c-title').textContent = r.emoji + ' ' + r.name;
  $('#c-n').textContent = t('step', { i: cookStep + 1, n: r.steps.length });
  $('#c-text').textContent = s.text;
  $('#c-bar').style.width = ((cookStep + 1) / r.steps.length * 100) + '%';
  $('#c-prev').disabled = cookStep === 0;
  $('#c-next').textContent = last ? '✓ ' + t('finish') : t('next');
  stopTimer();
  const tm = $('#c-timer'); tm.hidden = !s.minutes;
  if (s.minutes) { timerLeft = s.minutes * 60; paintTimer(); $('#c-timer-btn').textContent = t('startTimer', { m: s.minutes }); }
  if (voiceOn) speak(t('step', { i: cookStep + 1, n: r.steps.length }) + '. ' + s.text);
}
function paintTimer() {
  const m = String(Math.floor(timerLeft / 60)).padStart(2, '0'), s = String(timerLeft % 60).padStart(2, '0');
  $('#c-time').textContent = `${m}:${s}`;
}
function stopTimer() { clearInterval(timerId); timerId = null; }
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(d => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.2, audioCtx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + d + .25);
      o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + .3);
    });
  } catch {}
  if (NATIVE) NATIVE.vibrate(); else navigator.vibrate?.([300, 150, 300]);
}
$('#c-timer-btn').addEventListener('click', () => {
  if (timerId) { stopTimer(); $('#c-timer-btn').textContent = t('startTimer', { m: current.steps[cookStep].minutes }); return; }
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); // kullanıcı hareketiyle aç
  $('#c-timer-btn').textContent = t('stopTimer');
  timerId = setInterval(() => {
    timerLeft--; paintTimer();
    if (timerLeft <= 0) { stopTimer(); beep(); toast('⏰ ' + t('timeUp')); $('#c-timer-btn').textContent = t('startTimer', { m: current.steps[cookStep].minutes }); }
  }, 1000);
});
$('#c-prev').addEventListener('click', () => { if (cookStep > 0) { cookStep--; renderCook(); } });
$('#c-next').addEventListener('click', () => {
  if (cookStep < current.steps.length - 1) { cookStep++; renderCook(); } else { logCooked(current); closeOverlay($('#cook')); renderModal(); offerPlanAfterCook(); }
});

/* =====================================================================
   Pişirme: sesli komut + adım okuma (Android köprüsü)
   ===================================================================== */
let voiceOn = false;
const VOICE_CMDS = {
  next: /\b(ileri|sonraki|next|devam|continue)\b/i, prev: /\b(geri|önceki|back|previous)\b/i,
  timer: /\b(sayaç|sayac|zamanlayıcı|timer|başlat|start)\b/i, stop: /\b(durdur|dur|stop|pause)\b/i,
  read: /\b(oku|tekrar|read|repeat)\b/i, done: /\b(bitti|tamamla|finish|done)\b/i
};
function speak(text) { if (NATIVE && NATIVE.speak) NATIVE.speak(text, lang); else if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(text); u.lang = lang === 'tr' ? 'tr-TR' : 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); } }
function setVoice(on) {
  voiceOn = on; $('#c-mic').setAttribute('aria-pressed', on);
  $('#c-heard').textContent = on ? t('voiceHelp') : '';
  if (NATIVE && NATIVE.startVoice) { on ? NATIVE.startVoice(lang) : NATIVE.stopVoice(); }
}
window.onVoice = text => {
  if (!voiceOn || $('#cook').hidden) return;
  $('#c-heard').textContent = '“' + text + '”';
  if (VOICE_CMDS.next.test(text)) $('#c-next').click();
  else if (VOICE_CMDS.prev.test(text)) $('#c-prev').click();
  else if (VOICE_CMDS.stop.test(text)) { if (timerId) $('#c-timer-btn').click(); }
  else if (VOICE_CMDS.timer.test(text)) { if (!timerId && !$('#c-timer').hidden) $('#c-timer-btn').click(); }
  else if (VOICE_CMDS.read.test(text)) speak(current.steps[cookStep].text);
  else if (VOICE_CMDS.done.test(text)) { cookStep = current.steps.length - 1; $('#c-next').click(); }
};
window.onVoiceState = st => { if (st === 'unavailable') { setVoice(false); toast(t('voiceNA')); } if (st === 'listening' && voiceOn) $('#c-heard').textContent = t('voiceListening'); };
$('#c-mic').addEventListener('click', () => setVoice(!voiceOn));
$('#c-read').addEventListener('click', () => speak(current.steps[cookStep].text));

/* =====================================================================
   Olaylar
   ===================================================================== */
const input = $('#ing-input');
$('#chipbox').addEventListener('click', e => { if (!e.target.closest('button')) input.focus(); });
input.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ',') && input.value.trim()) { e.preventDefault(); addIngredients(input.value); input.value = ''; }
  else if (e.key === 'Enter' && !input.value.trim()) { e.preventDefault(); findRecipes(); }
  else if (e.key === 'Backspace' && !input.value && pantry.length) { pantry.pop(); store.set('pantry', pantry); renderChips(); renderQuick(); }
});
input.addEventListener('blur', () => { if (input.value.trim()) { addIngredients(input.value); input.value = ''; } });
input.addEventListener('paste', e => {
  const txt = (e.clipboardData || window.clipboardData).getData('text');
  if (/[,;\n]/.test(txt)) { e.preventDefault(); addIngredients(txt); }
});
$('#chips').addEventListener('click', e => {
  const l = e.target.closest('[data-rml]');
  if (l) { leftovers.splice(Number(l.dataset.rml), 1); store.set('leftovers', leftovers); renderChips(); return; }
  const it = e.target.closest('[data-item]');
  if (it) { openItem(Number(it.dataset.item)); return; }
  const b = e.target.closest('[data-rm]'); if (!b) return;
  pantry.splice(Number(b.dataset.rm), 1); store.set('pantry', pantry); renderChips(); renderQuick(); renderSets();
});
$('#btn-left').addEventListener('click', async () => {
  const raw = await ask(t('leftTitle'), { placeholder: t('leftAsk'), hint: t('leftHint') }); if (!raw) return;
  raw.split(/[,;\n]/).map(x => x.trim()).filter(Boolean).forEach(x => { if (!leftovers.some(y => y.toLowerCase() === x.toLowerCase())) leftovers.push(x); });
  store.set('leftovers', leftovers); renderChips();
});
$('#quick').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (b) addIngredients(b.dataset.q); });

function toggleIn(arr, v) { const i = arr.indexOf(v); i > -1 ? arr.splice(i, 1) : arr.push(v); }
$('#cuisines').addEventListener('click', e => {
  const b = e.target.closest('[data-cuisine]'); if (!b) return;
  toggleIn(selCuisines, b.dataset.cuisine); store.set('cuisines', selCuisines); renderCuisines();
});
$('#diets').addEventListener('click', e => {
  const b = e.target.closest('[data-diet]'); if (!b) return;
  toggleIn(selDiets, b.dataset.diet); store.set('diets', selDiets); renderDiets();
});

function syncPrefs() {
  $('#opt-time').value = String(prefs.time); $('#opt-diff').value = prefs.diff;
  $('#opt-count').value = String(prefs.count); $('#srv-out').textContent = prefs.servings; $('#opt-note').value = prefs.note || '';
}
function savePrefs() { store.set('prefs', prefs); }
$('#opt-time').addEventListener('change', e => { prefs.time = Number(e.target.value); savePrefs(); });
$('#opt-note').addEventListener('input', e => { prefs.note = e.target.value.slice(0, 300); savePrefs(); });
$('#opt-diff').addEventListener('change', e => { prefs.diff = e.target.value; savePrefs(); });
$('#opt-count').addEventListener('change', e => {
  if (!pro && Number(e.target.value) > 6) { e.target.value = '6'; openPro(t('proLockCount')); return; }
  prefs.count = Number(e.target.value); savePrefs();
});
$('#srv-minus').addEventListener('click', () => { prefs.servings = Math.max(1, prefs.servings - 1); syncPrefs(); savePrefs(); });
$('#srv-plus').addEventListener('click', () => { prefs.servings = Math.min(12, prefs.servings + 1); syncPrefs(); savePrefs(); });

$('#btn-find').addEventListener('click', () => findRecipes(false));
$('#btn-more').addEventListener('click', () => mode === 'crave' ? craveMore() : findRecipes(true));
$('#status').addEventListener('click', e => { if (e.target.closest('#btn-retry')) findRecipes(false); });

$('#tab-results').addEventListener('click', () => { view = 'results'; render(); });
$('#tab-fav').addEventListener('click', () => { view = 'fav'; render(); });
$('#only-complete').addEventListener('change', render);
$('#sort').addEventListener('change', render);

$('#grid').addEventListener('click', e => {
  const fav = e.target.closest('[data-fav]');
  if (fav) { e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
  const card = e.target.closest('.card'); if (card) openRecipe(card.dataset.id);
});
$('#grid').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) { e.preventDefault(); openRecipe(e.target.dataset.id); }
});

$('#btn-shop').addEventListener('click', () => { renderShop(); openOverlay($('#shop-modal')); });
$('#btn-settings').addEventListener('click', () => {
  $('#set-key').value = settings.key; $('#set-model').value = settings.model;
  $('#rem-on').checked = !!remind.on; $('#rem-time').value = remind.time || '17:00'; renderFamily();
  openOverlay($('#settings-modal'));
});
$('#set-save').addEventListener('click', () => {
  settings.key = $('#set-key').value.trim();
  settings.model = $('#set-model').value.trim() || 'gemini-3.5-flash-lite';
  store.set('settings', settings); closeOverlay($('#settings-modal')); toast(t('saved')); paintQuota();
});

function paintTheme() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#theme-icon').textContent = dark ? '☀️' : '🌙';
}
$('#btn-theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('theme', next); paintTheme();
});
$('#btn-lang').addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr'; store.set('lang', lang);
  applyI18n(); render(); renderShop(); renderSets(); paintQuota(); renderCraveSugg();
  if (current && !$('#recipe-modal').hidden) renderModal();
  if (!$('#guest-modal').hidden) renderGuest();
  if (!$('#pro-modal').hidden) renderPro();
  if (!$('#plan-modal').hidden) renderPlan();
});

// Android geri tuşu: açık pencere varsa onu kapatır
window.androidBack = () => { if (stack.length) { closeOverlay(stack[stack.length - 1]); return true; } return false; };

/* =====================================================================
   Başlat
   ===================================================================== */
syncPrefs(); paintTheme(); applyI18n(); render(); renderShop(); renderSets(); paintQuota(); syncReminder();
$('#city-input').value = city; setMode(mode);
if (NATIVE && NATIVE.pendingRecipe) { const pid = NATIVE.pendingRecipe(); if (pid) setTimeout(() => window.openFromNative(pid), 300); }
if (NATIVE && NATIVE.refreshPro) NATIVE.refreshPro();
</script>
