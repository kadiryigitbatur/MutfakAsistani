<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mutfak Asistanı · AI Kitchen Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Tema titremesini önlemek için erken uygula
  try {
    var th = JSON.parse(localStorage.getItem('kitchen.theme') || 'null');
    if (!th) th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = th;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
:root {
  --bg:#EDF2EA; --surface:#FFFFFF; --surface-2:#F5F8F3; --ink:#15241D; --muted:#586B60; --line:#D5DFD3;
  --accent:#1F6B45; --accent-ink:#FFFFFF; --accent-soft:#DDEFE3; --sun:#F2B01E; --sun-ink:#3A2A00;
  --warn-bg:#FFF0D1; --warn-ink:#7A4B00; --ok-bg:#DDF1E3; --ok-ink:#17502F; --bad:#C8452A;
  --tl1:90%; --tl2:82%; --shadow:0 1px 2px rgba(21,36,29,.06), 0 8px 24px -12px rgba(21,36,29,.18);
  --radius:16px; --font-display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body:'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
:root[data-theme="dark"] {
  --bg:#0D1612; --surface:#15231C; --surface-2:#1B2C24; --ink:#E8F0EA; --muted:#9BB0A4; --line:#27392F;
  --accent:#5FCB8D; --accent-ink:#0D1612; --accent-soft:#1D3A2B; --sun:#F2B01E; --sun-ink:#3A2A00;
  --warn-bg:#3A2D10; --warn-ink:#F6D58B; --ok-bg:#183626; --ok-ink:#9FE3BB; --bad:#FF8466;
  --tl1:24%; --tl2:18%; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*,*::before,*::after { box-sizing:border-box; }
html { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }
body { margin:0; padding:var(--sat,env(safe-area-inset-top)) var(--sar,env(safe-area-inset-right)) var(--sab,env(safe-area-inset-bottom)) var(--sal,env(safe-area-inset-left)); font-family:var(--font-body); background:var(--bg); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
h1,h2,h3 { font-family:var(--font-display); margin:0; line-height:1.15; letter-spacing:-.01em; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
[hidden] { display:none !important; }
:focus-visible { outline:3px solid var(--sun); outline-offset:2px; border-radius:8px; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- Üst bar ---------- */
.topbar { max-width:1280px; margin:0 auto; padding:18px 20px 8px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:12px; margin-right:auto; min-width:0; }
.brand-mark { width:44px; height:44px; border-radius:14px; background:var(--sun); color:var(--sun-ink); display:grid; place-items:center; font-size:24px; flex:none; }
.brand h1 { font-size:clamp(1.35rem, 3vw, 1.9rem); font-weight:800; }
.brand p { margin:2px 0 0; color:var(--muted); font-size:.92rem; }
.tools { display:flex; gap:8px; align-items:center; }
.icon-btn { position:relative; height:42px; min-width:42px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:600; font-size:.9rem; }
.icon-btn:hover { background:var(--surface-2); }
.icon-btn .count { background:var(--accent); color:var(--accent-ink); border-radius:999px; font-size:.72rem; min-width:20px; height:20px; padding:0 6px; display:grid; place-items:center; }

/* ---------- Ana yerleşim ---------- */
.layout { max-width:1280px; margin:0 auto; padding:12px 20px 60px; display:grid; grid-template-columns:minmax(0,380px) minmax(0,1fr); gap:24px; align-items:start; }
@media (max-width: 960px) { .layout { grid-template-columns:1fr; } }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:22px; }
@media (min-width: 961px) { .panel { position:sticky; top:16px; max-height:calc(100vh - 32px); overflow-y:auto; } }
.field-title { font-size:1.05rem; font-weight:700; margin-bottom:10px; font-family:var(--font-display); }
.hint { color:var(--muted); font-size:.85rem; margin:6px 0 0; }

/* Malzeme giriş kutusu */
.chipbox { display:flex; flex-wrap:wrap; gap:6px; padding:8px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface-2); min-height:56px; cursor:text; }
.chipbox:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.chipbox input { flex:1; min-width:140px; border:0; background:transparent; outline:0; padding:6px 6px; }
.chip { display:inline-flex; align-items:center; gap:4px; background:var(--accent-soft); color:var(--accent); padding:4px 4px 4px 12px; border-radius:999px; font-weight:600; font-size:.9rem; }
:root[data-theme="light"] .chip { color:var(--accent); }
.chip button { border:0; background:transparent; width:22px; height:22px; border-radius:50%; line-height:1; font-size:16px; color:inherit; }
.chip button:hover { background:rgba(0,0,0,.1); }
.quick { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.quick button { border:1px dashed var(--line); background:transparent; border-radius:999px; padding:3px 11px; font-size:.85rem; color:var(--muted); }
.quick button:hover { border-color:var(--accent); color:var(--accent); }

/* Seçim düğmeleri */
.toggles { display:flex; flex-wrap:wrap; gap:8px; }
.toggle { border:1.5px solid var(--line); background:var(--surface); border-radius:12px; padding:7px 12px; font-weight:600; font-size:.9rem; display:inline-flex; align-items:center; gap:6px; transition:background .15s, border-color .15s; }
.toggle:hover { border-color:var(--accent); }
.toggle[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.toggle .flag { font-size:1.15rem; line-height:1; }

.options { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.options label { display:flex; flex-direction:column; gap:5px; font-size:.85rem; font-weight:600; color:var(--muted); }
.options select { height:42px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); padding:0 10px; color:var(--ink); }
.stepper { display:flex; align-items:center; height:42px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); overflow:hidden; }
.stepper button { width:40px; height:100%; border:0; background:transparent; font-size:1.2rem; font-weight:700; }
.stepper button:hover { background:var(--accent-soft); }
.stepper output { flex:1; text-align:center; font-weight:700; color:var(--ink); }

.btn { border:0; border-radius:14px; padding:14px 18px; font-weight:700; font-size:1rem; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary { background:var(--accent); color:var(--accent-ink); }
.btn-primary:hover { filter:brightness(1.08); }
.btn-primary:disabled { opacity:.6; cursor:progress; }
.btn-ghost { background:var(--surface-2); border:1px solid var(--line); color:var(--ink); }
.btn-ghost:hover { background:var(--accent-soft); }
.btn-sun { background:var(--sun); color:var(--sun-ink); }
.btn-sun:hover { filter:brightness(1.05); }
.btn-sm { padding:9px 14px; font-size:.9rem; border-radius:12px; }

/* ---------- Sonuçlar ---------- */
.results-bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:16px; }
.tabs { display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:4px; margin-right:auto; }
.tabs button { border:0; background:transparent; padding:8px 16px; border-radius:10px; font-weight:700; color:var(--muted); }
.tabs button[aria-selected="true"] { background:var(--accent); color:var(--accent-ink); }
.results-bar select { height:40px; border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:0 10px; }
.check { display:inline-flex; align-items:center; gap:8px; font-size:.9rem; font-weight:600; }
.check input { width:18px; height:18px; accent-color:var(--accent); }

.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:18px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow); text-align:left; padding:0; color:inherit; transition:transform .18s ease, border-color .18s ease; }
.card:hover { transform:translateY(-3px); border-color:var(--accent); }
.card-hero { position:relative; height:128px; display:grid; place-items:center; font-size:3.6rem; background:linear-gradient(135deg, hsl(var(--h) 55% var(--tl1)), hsl(calc(var(--h) + 40) 60% var(--tl2))); }
.fav-btn { position:absolute; top:10px; right:10px; width:38px; height:38px; border-radius:50%; border:0; background:rgba(255,255,255,.88); color:#B33A3A; font-size:1.15rem; display:grid; place-items:center; }
:root[data-theme="dark"] .fav-btn { background:rgba(13,22,18,.7); color:#FF9B8A; }
.ring { position:absolute; left:10px; top:10px; width:42px; height:42px; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--p) * 1%), rgba(255,255,255,.55) 0); display:grid; place-items:center; }
.ring span { width:32px; height:32px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-size:.72rem; font-weight:800; color:var(--ink); }
.card-body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; flex:1; }
.card h3 { font-size:1.08rem; font-weight:800; }
.card .desc { color:var(--muted); font-size:.88rem; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.meta { display:flex; flex-wrap:wrap; gap:6px 12px; color:var(--muted); font-size:.84rem; font-weight:600; margin-top:auto; }
.badge { border-radius:10px; padding:6px 10px; font-size:.82rem; font-weight:600; }
.badge-ok { background:var(--ok-bg); color:var(--ok-ink); }
.badge-warn { background:var(--warn-bg); color:var(--warn-ink); }

.state { text-align:center; padding:56px 20px; color:var(--muted); background:var(--surface); border:1.5px dashed var(--line); border-radius:20px; }
.state .big { font-size:3rem; }
.state h2 { color:var(--ink); font-size:1.3rem; margin:8px 0 6px; }
.state p { margin:0 auto 16px; max-width:46ch; }
.state.error h2 { color:var(--bad); }
.more { text-align:center; margin-top:26px; }

.skeleton { height:290px; border-radius:var(--radius); border:1px solid var(--line); background:linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size:300% 100%; animation:shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position:100% 0; } to { background-position:0 0; } }
.spinner { width:18px; height:18px; border:3px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Tarifler hazırlanırken: sallanan tava */
.cooking { grid-column:1 / -1; display:flex; flex-direction:column; align-items:center; gap:18px; padding:48px 16px 40px; text-align:center; }
.pan { position:relative; width:150px; height:150px; animation:pan-shake 1.6s ease-in-out infinite; transform-origin:70% 60%; }
.pan svg { width:100%; height:100%; display:block; overflow:visible; }
.pan .egg { animation:egg-jump 1.6s ease-in-out infinite; transform-origin:46px 57px; }
.pan .steam { opacity:0; animation:steam 2.4s ease-out infinite; transform-origin:50% 100%; }
.pan .steam:nth-child(2) { animation-delay:.8s; }
.pan .steam:nth-child(3) { animation-delay:1.6s; }
.cooking .msg { font-family:var(--font-display); font-weight:700; font-size:1.15rem; color:var(--ink); min-height:1.6em; animation:pop .35s ease-out; }
.cooking .sub { color:var(--muted); font-size:.92rem; }
.cooking .dots { display:flex; gap:7px; }
.cooking .dots i { width:9px; height:9px; border-radius:50%; background:var(--accent); opacity:.3; animation:dot 1.2s ease-in-out infinite; }
.cooking .dots i:nth-child(2) { animation-delay:.2s; } .cooking .dots i:nth-child(3) { animation-delay:.4s; }
@keyframes pan-shake { 0%,100% { transform:rotate(0) translateX(0); } 20% { transform:rotate(-7deg) translateX(-4px); } 40% { transform:rotate(5deg) translateX(3px); } 60% { transform:rotate(-4deg) translateX(-2px); } 80% { transform:rotate(3deg) translateX(1px); } }
@keyframes egg-jump { 0%,100% { transform:translateY(0) rotate(0); } 30% { transform:translateY(-14px) rotate(-8deg); } 55% { transform:translateY(0) rotate(0); } 75% { transform:translateY(-6px) rotate(5deg); } }
@keyframes steam { 0% { opacity:0; transform:translateY(0) scaleX(1); } 25% { opacity:.7; } 100% { opacity:0; transform:translateY(-36px) scaleX(1.4); } }
/* Kiler: son kullanma, artanlar, fotoğraf */
.chip.soon { background:#FDEBC2; color:#6B4A00; }
.chip.expired { background:#F8D7D7; color:#7A1F1F; }
.chip.left { background:#E4E7F7; color:#2F3A7A; }
.chip .nm { cursor:pointer; }
.pantry-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.pantry-actions button { border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:7px 12px; font-size:.85rem; font-weight:600; cursor:pointer; }
.pantry-actions button:hover { border-color:var(--accent); color:var(--accent); }
.soon-box { margin-top:12px; background:#FDEBC2; color:#6B4A00; border-radius:12px; padding:10px 12px; font-size:.88rem; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.soon-box button { margin-left:auto; border:0; background:#6B4A00; color:#fff; border-radius:999px; padding:6px 12px; font-weight:700; font-size:.82rem; cursor:pointer; }
.quickdates { display:flex; gap:8px; flex-wrap:wrap; }
.quickdates button { border:1.5px solid var(--line); background:var(--surface-2); border-radius:999px; padding:6px 12px; font-size:.85rem; cursor:pointer; color:var(--ink); }
.scan-prev { width:100%; max-height:220px; object-fit:cover; border-radius:14px; }
.scan-list { display:flex; flex-wrap:wrap; gap:8px; }
.scan-list label { display:inline-flex; gap:6px; align-items:center; background:var(--accent-soft); color:var(--accent); padding:6px 12px; border-radius:999px; font-weight:600; font-size:.9rem; cursor:pointer; }
.scan-list input { accent-color:var(--accent); }
textarea.note { width:100%; min-height:64px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); padding:10px; color:var(--ink); font:inherit; resize:vertical; }
/* Pişirme: ses */
.cook-voice { display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; color:var(--muted); font-size:.9rem; }
.mic { border:2px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:10px 16px; font-weight:700; cursor:pointer; }
.mic[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); animation:micpulse 1.6s ease-in-out infinite; }
@keyframes micpulse { 0%,100% { box-shadow:0 0 0 0 rgba(31,107,69,.45); } 50% { box-shadow:0 0 0 10px rgba(31,107,69,0); } }
/* Günlük */
.diary { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.diary .big-n { font-family:var(--font-display); font-size:1.6rem; font-weight:800; color:var(--accent); }
.diary .badges { display:flex; gap:6px; flex-wrap:wrap; }
.diary .bd { background:var(--surface-2); border-radius:999px; padding:4px 10px; font-size:.8rem; font-weight:700; }
.diary .bd.on { background:var(--sun); color:var(--sun-ink); }
.diary .lst { width:100%; display:flex; gap:8px; flex-wrap:wrap; }
.diary .lst button { border:1.5px solid var(--line); background:var(--surface-2); border-radius:999px; padding:5px 10px; font-size:.82rem; cursor:pointer; color:var(--ink); }
/* Aile */
.fam { display:flex; flex-direction:column; gap:8px; }
.fam .row { display:flex; gap:8px; align-items:center; }
.fam .row input { flex:1; min-width:0; }
.fam .row .rm { border:0; background:transparent; font-size:1.2rem; cursor:pointer; color:var(--muted); }
.plan-opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 12px; }
.plan-opts label { display:flex; flex-direction:column; gap:4px; font-size:.82rem; color:var(--muted); }
.plan-opts input { height:40px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); padding:0 10px; color:var(--ink); font:inherit; }
.plan-cost { color:var(--muted); font-size:.82rem; }
/* Mod seçici */
.modes { max-width:1280px; margin:0 auto; padding:4px 20px 0; }
.seg { display:inline-flex; background:var(--surface); border:1.5px solid var(--line); border-radius:999px; padding:4px; gap:4px; }
.seg button { border:0; background:transparent; color:var(--muted); font-weight:700; font-size:.95rem; padding:10px 18px; border-radius:999px; cursor:pointer; display:inline-flex; gap:8px; align-items:center; }
.seg button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
/* Canım ne istiyor */
.crave-input { width:100%; height:52px; border:2px solid var(--line); border-radius:14px; background:var(--surface-2); padding:0 14px; font:inherit; font-size:1.05rem; color:var(--ink); }
.crave-input:focus { border-color:var(--accent); outline:0; }
.crave-sugg { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.crave-sugg button { border:1.5px dashed var(--line); background:transparent; color:var(--muted); border-radius:999px; padding:6px 12px; font-size:.85rem; cursor:pointer; }
.city-row { display:flex; gap:8px; }
.city-row input { flex:1; min-width:0; height:44px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); padding:0 12px; color:var(--ink); font:inherit; }
.city-row button { border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:0 12px; cursor:pointer; color:var(--ink); }
.rest-head { display:flex; align-items:center; gap:10px; margin:26px 0 12px; }
.rest-head h2 { font-family:var(--font-display); font-size:1.2rem; margin:0; flex:1; }
.rest-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
.rest { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; display:flex; flex-direction:column; gap:6px; position:relative; }
.rest.sponsored { border-color:var(--sun); box-shadow:0 0 0 3px #FDEBC2; }
.rest .sp { position:absolute; top:10px; right:12px; background:var(--sun); color:var(--sun-ink); font-size:.68rem; font-weight:800; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; }
.rest h3 { font-size:1.02rem; margin:0; padding-right:70px; }
.rest .rate { display:flex; align-items:center; gap:8px; font-weight:700; }
.rest .stars { color:#E0A100; letter-spacing:1px; }
.rest .addr { color:var(--muted); font-size:.85rem; }
.rest .act { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
.rest .act a { font-size:.85rem; font-weight:700; color:var(--accent); text-decoration:none; border:1.5px solid var(--line); border-radius:999px; padding:6px 12px; }
.open-now { color:var(--accent); font-size:.8rem; font-weight:700; }
.closed-now { color:#A33; font-size:.8rem; font-weight:700; }
/* Skor ve kartlar */
.score-card { background:linear-gradient(135deg, var(--accent), #2E8A5C); color:#fff; border-radius:var(--radius); padding:16px 18px; display:flex; gap:16px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.score-card .n { font-family:var(--font-display); font-size:2.2rem; font-weight:800; line-height:1; }
.score-card .tx { flex:1; min-width:180px; }
.score-card .tx b { display:block; font-size:1.05rem; }
.score-card .tx span { opacity:.9; font-size:.88rem; }
.score-card button { border:0; background:#fff; color:var(--accent); font-weight:800; border-radius:999px; padding:10px 16px; cursor:pointer; }
.upsell-card { border:2px dashed var(--sun); background:#FFF8E6; color:#3A2A00; border-radius:var(--radius); padding:18px; display:flex; flex-direction:column; gap:10px; justify-content:center; cursor:pointer; }
:root[data-theme="dark"] .upsell-card { background:#2A2200; color:#FFE6A3; }
.upsell-card b { font-family:var(--font-display); font-size:1.15rem; }
.upsell-card .x { position:static; align-self:flex-end; }
.save-box { display:flex; gap:14px; align-items:center; background:var(--surface-2); border-radius:14px; padding:12px 14px; width:100%; }
.save-box .amt { font-family:var(--font-display); font-weight:800; font-size:1.5rem; color:var(--accent); }
.save-box small { color:var(--muted); }
.nutri { display:flex; gap:10px; flex-wrap:wrap; width:100%; }
.nutri .box { background:var(--surface-2); border-radius:12px; padding:8px 12px; font-size:.85rem; }
.nutri .box b { display:block; font-family:var(--font-display); font-size:1.1rem; }
.task-box { width:100%; display:flex; gap:10px; align-items:center; background:#E4E7F7; color:#2F3A7A; border-radius:12px; padding:10px 12px; font-size:.88rem; }
.task-box.done { background:var(--accent-soft); color:var(--accent); }
.dislike[aria-pressed="true"] { background:#F8D7D7; color:#7A1F1F; }
.guest-course { display:flex; gap:14px; align-items:center; background:var(--surface-2); border-radius:14px; padding:12px 14px; cursor:pointer; border:1.5px solid transparent; }
.guest-course:hover { border-color:var(--accent); }
.guest-course .c { flex:none; font-size:.72rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); width:84px; }
.guest-course .e { font-size:1.5rem; }
.guest-course .n { flex:1; min-width:0; } .guest-course .n b { display:block; } .guest-course .n span { color:var(--muted); font-size:.85rem; }
.timeline { margin-top:14px; display:flex; flex-direction:column; gap:6px; }
.timeline div { display:flex; gap:10px; font-size:.9rem; } .timeline b { flex:none; min-width:84px; color:var(--accent); font-family:var(--font-display); }
#print-area { display:none; }
/* Pro */
.pro-tag { display:inline-flex; align-items:center; gap:4px; background:var(--sun); color:var(--sun-ink); font-size:.68rem; font-weight:800; letter-spacing:.04em; padding:2px 7px; border-radius:999px; vertical-align:middle; text-transform:uppercase; }
.icon-btn.is-pro { border-color:var(--sun); color:var(--sun-ink); background:#FFF4D6; }
:root[data-theme="dark"] .icon-btn.is-pro { background:#3A2A00; color:var(--sun); }
.quota { font-size:.82rem; color:var(--muted); text-align:center; margin-top:10px; }
.quota b { color:var(--ink); }
.lock-row { display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px dashed var(--line); border-radius:12px; padding:10px 14px; color:var(--muted); font-size:.9rem; cursor:pointer; }
.lock-row:hover { border-color:var(--sun); }
.macros { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
.macro { background:var(--surface-2); border-radius:12px; padding:10px 12px; text-align:center; }
.macro b { display:block; font-family:var(--font-display); font-size:1.15rem; }
.macro span { font-size:.78rem; color:var(--muted); }
.twists { display:flex; flex-wrap:wrap; gap:8px; }
.twists button { border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:7px 14px; font-weight:600; font-size:.88rem; cursor:pointer; }
.twists button:hover { border-color:var(--accent); color:var(--accent); }
.paywall { display:flex; flex-direction:column; gap:18px; }
.paywall .hero { background:linear-gradient(135deg, var(--accent), #2E8A5C); color:#fff; border-radius:18px; padding:22px; text-align:center; }
.paywall .hero h3 { font-family:var(--font-display); font-size:1.5rem; margin:0 0 6px; }
.paywall .hero p { margin:0; opacity:.9; }
.paywall ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.paywall li { display:flex; gap:12px; align-items:flex-start; }
.paywall li .ic { flex:none; width:36px; height:36px; border-radius:10px; background:var(--accent-soft); display:grid; place-items:center; font-size:1.1rem; }
.paywall li b { display:block; }
.paywall li span { color:var(--muted); font-size:.9rem; }
.paywall .price { font-family:var(--font-display); font-size:1.4rem; font-weight:800; text-align:center; }
.paywall .price small { display:block; font-size:.85rem; font-weight:500; color:var(--muted); }
.paywall .promo { display:flex; gap:8px; }
.paywall .promo input { flex:1; min-width:0; }
.pantry-sets { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center; }
.pantry-sets button { border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:6px 12px; font-size:.85rem; font-weight:600; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
.pantry-sets button .del { opacity:.5; }
.plan-list { display:flex; flex-direction:column; gap:10px; }
.plan-day { display:flex; gap:14px; align-items:center; background:var(--surface-2); border-radius:14px; padding:12px 14px; cursor:pointer; border:1.5px solid transparent; }
.plan-day:hover { border-color:var(--accent); }
.plan-day .d { flex:none; width:44px; font-weight:800; color:var(--accent); font-family:var(--font-display); }
.plan-day .e { font-size:1.6rem; }
.plan-day .n { flex:1; min-width:0; }
.plan-day .n b { display:block; }
.plan-day .n span { color:var(--muted); font-size:.85rem; }
.pro-only select option[data-pro] { color:var(--muted); }
@keyframes dot { 0%,80%,100% { opacity:.3; transform:scale(1); } 40% { opacity:1; transform:scale(1.25); } }

/* ---------- Katmanlar ---------- */
.overlay { position:fixed; inset:0; z-index:50; background:rgba(5,12,9,.66); display:flex; justify-content:center; align-items:center; padding:calc(16px + var(--sat,0px)) calc(16px + var(--sar,0px)) calc(16px + var(--sab,0px)) calc(16px + var(--sal,0px)); }
.sheet { background:var(--surface); border-radius:22px; width:100%; max-width:720px; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 30px 80px -20px rgba(0,0,0,.6); overflow:hidden; }
.sheet-head { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); }
.sheet-head h2 { font-size:1.35rem; font-weight:800; flex:1; min-width:0; }
.sheet-body { padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:20px; }
.sheet-foot { padding:14px 20px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px; background:var(--surface-2); }
.sheet-foot .btn { flex:1 1 auto; }
.x { border:0; background:var(--surface-2); width:40px; height:40px; border-radius:50%; font-size:1.4rem; line-height:1; flex:none; }
.x:hover { background:var(--accent-soft); }
.drawer { justify-content:flex-end; align-items:stretch; padding:0; }
.drawer .sheet { max-width:420px; max-height:none; height:100%; border-radius:22px 0 0 22px; }
@media (max-width:520px){ .drawer .sheet { border-radius:0; } }

.recipe-hero { display:flex; align-items:center; gap:16px; padding:18px; border-radius:16px; background:linear-gradient(135deg, hsl(var(--h) 55% var(--tl1)), hsl(calc(var(--h) + 40) 60% var(--tl2))); }
.recipe-hero .e { font-size:3.2rem; line-height:1; }
.recipe-hero p { margin:0; font-size:.98rem; }
.facts { display:flex; flex-wrap:wrap; gap:8px; }
.fact { background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:6px 12px; font-size:.86rem; font-weight:600; }
.fact b { font-weight:800; }
.sec-title { font-size:1.15rem; font-weight:800; display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.sec-title .grow { flex:1; }
.ing-list { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.ing-list li { display:flex; gap:10px; align-items:baseline; padding:8px 12px; border-radius:10px; background:var(--surface-2); }
.ing-list .mark { font-weight:800; width:1.1em; flex:none; }
.ing-list li.have .mark { color:var(--accent); }
.ing-list li.lack { background:var(--warn-bg); color:var(--warn-ink); }
.ing-list li.lack .mark { color:var(--bad); }
.steps { list-style:none; margin:0; padding:0; display:grid; gap:12px; counter-reset:s; }
.steps li { counter-increment:s; display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:start; }
.steps li::before { content:counter(s); width:34px; height:34px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-weight:800; display:grid; place-items:center; }
.steps .t { max-width:64ch; }
.steps .tm { display:inline-block; margin-top:4px; font-size:.8rem; font-weight:700; color:var(--muted); }
.tip { background:var(--accent-soft); border-radius:12px; padding:12px 14px; }
.scaler { display:inline-flex; align-items:center; gap:4px; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; }
.scaler button { width:32px; height:32px; border:0; background:var(--surface-2); font-weight:800; }
.scaler output { min-width:76px; text-align:center; font-size:.85rem; font-weight:700; }

/* Alışveriş listesi */
.shop-list { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.shop-list li { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--surface-2); border-radius:10px; }
.shop-list input { width:18px; height:18px; accent-color:var(--accent); }
.shop-list label { flex:1; }
.shop-list li.done label { text-decoration:line-through; color:var(--muted); }
.shop-list .rm { border:0; background:transparent; color:var(--muted); font-size:1.1rem; }

/* Ayarlar */
.form-row { display:flex; flex-direction:column; gap:6px; }
.form-row label { font-weight:700; }
.form-row input { height:44px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface-2); padding:0 12px; }

/* Pişirme modu */
.cook { background:var(--bg); padding:var(--sat,0px) var(--sar,0px) var(--sab,0px) var(--sal,0px); align-items:stretch; z-index:60; }
.cook-inner { width:100%; max-width:900px; margin:0 auto; display:flex; flex-direction:column; padding:18px 20px 24px; gap:18px; }
.cook-top { display:flex; align-items:center; gap:12px; }
.cook-top h2 { flex:1; font-size:1.2rem; }
.progress { height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
.progress i { display:block; height:100%; background:var(--accent); transition:width .3s ease; }
.cook-step { flex:1; display:flex; flex-direction:column; justify-content:center; gap:20px; }
.cook-step .n { color:var(--muted); font-weight:700; }
.cook-step p { font-family:var(--font-display); font-weight:600; font-size:clamp(1.5rem, 4.2vw, 2.4rem); line-height:1.3; margin:0; max-width:30ch; }
.timer { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.timer .time { font-family:var(--font-display); font-size:2.6rem; font-weight:800; font-variant-numeric:tabular-nums; }
.cook-nav { display:grid; grid-template-columns:1fr 2fr; gap:12px; }
.cook-nav .btn { padding:18px; font-size:1.1rem; }

/* Toast */
.toasts { position:fixed; left:50%; bottom:calc(20px + var(--sab,0px)); transform:translateX(-50%); z-index:100; display:grid; gap:8px; width:min(92vw, 420px); pointer-events:none; }
.toast { background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:12px; font-weight:600; box-shadow:var(--shadow); animation:pop .2s ease; }
@keyframes pop { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
@media print {
  body > *:not(#recipe-modal):not(#print-area) { display:none !important; }
  body.print-plan #recipe-modal { display:none !important; }
  body.print-plan #print-area { display:block !important; font-family:Georgia, serif; color:#000; padding:20px; }
  #print-area h1 { font-size:22pt; margin:0 0 6pt; } #print-area h2 { font-size:14pt; margin:14pt 0 6pt; border-bottom:1px solid #000; }
  #print-area table { width:100%; border-collapse:collapse; font-size:11pt; } #print-area td { padding:4pt 6pt; border-bottom:1px solid #ccc; vertical-align:top; }
  #print-area ul { columns:2; font-size:11pt; }
  #recipe-modal { position:static; background:#fff; padding:0; display:block; }
  #recipe-modal .sheet { max-height:none; box-shadow:none; color:#000; }
  .sheet-foot, .x, .scaler button, .fav-btn { display:none !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">🍳</div>
    <div>
      <h1 data-i18n="appTitle">Mutfak Asistanı</h1>
      <p data-i18n="tagline"></p>
    </div>
  </div>
  <div class="tools">
    <button class="icon-btn" id="btn-shop" aria-label="Shopping list"><span aria-hidden="true">🛒</span><span class="count" id="shop-count" hidden>0</span></button>
    <button class="icon-btn" id="btn-lang" aria-label="Language">TR / EN</button>
    <button class="icon-btn" id="btn-theme" aria-label="Theme"><span id="theme-icon" aria-hidden="true">🌙</span></button>
    <button class="icon-btn" id="btn-plan" aria-label="Weekly plan"><span aria-hidden="true">📅</span></button>
    <button class="icon-btn" id="btn-guest" aria-label="Guest menu"><span aria-hidden="true">🍽️</span></button>
    <button class="icon-btn" id="btn-pro" aria-label="Pro"><span aria-hidden="true">✨</span> <span id="pro-label">Pro</span></button>
    <button class="icon-btn" id="btn-settings" aria-label="Settings"><span aria-hidden="true">⚙️</span></button>
  </div>
</header>

<div class="modes">
  <div class="seg" role="tablist" aria-label="Mode">
    <button type="button" id="mode-pantry" role="tab" aria-pressed="true">🥕 <span data-i18n="modePantry"></span></button>
    <button type="button" id="mode-crave" role="tab" aria-pressed="false">😋 <span data-i18n="modeCrave"></span></button>
  </div>
</div>

<main class="layout">
  <!-- Sol panel: tercihler -->
  <aside class="panel" aria-label="Preferences">
    <div id="crave-panel" hidden>
      <section>
        <h2 class="field-title" data-i18n="craveTitle"></h2>
        <input id="crave-input" class="crave-input" type="text" autocomplete="off" data-i18n-ph="cravePh" enterkeyhint="search">
        <div class="crave-sugg" id="crave-sugg"></div>
      </section>
      <section>
        <h2 class="field-title" data-i18n="cityTitle"></h2>
        <div class="city-row"><input id="city-input" type="text" autocomplete="off" data-i18n-ph="cityPh"><button type="button" id="btn-locate" title="GPS">📍</button></div>
        <p class="hint" data-i18n="cityHelp"></p>
      </section>
      <div style="display:flex; flex-direction:column; gap:10px">
        <button class="btn btn-primary" id="btn-crave"><span data-i18n="craveFind"></span></button>
        <button class="btn btn-sun" id="btn-rest"><span data-i18n="restFind"></span></button>
      </div>
      <p class="quota" id="quota2"></p>
    </div>
    <div id="pantry-panel">
    <section>
      <h2 class="field-title" data-i18n="pantryTitle"></h2>
      <div class="chipbox" id="chipbox">
        <div id="chips" style="display:contents"></div>
        <input id="ing-input" type="text" autocomplete="off" data-i18n-ph="pantryPh" aria-label="Ingredient">
      </div>
      <div class="quick" id="quick" aria-label="Quick add"></div>
      <div class="pantry-actions">
        <button type="button" id="btn-scan">📷 <span data-i18n="scan"></span></button>
        <button type="button" id="btn-left">♻️ <span data-i18n="leftovers"></span></button>
        <input id="scan-file" type="file" accept="image/*" capture="environment" hidden>
      </div>
      <div class="soon-box" id="soon-box" hidden></div>
      <div class="pantry-sets" id="pantry-sets"></div>
    </section>

    <section>
      <h2 class="field-title" data-i18n="cuisineTitle"></h2>
      <div class="toggles" id="cuisines"></div>
    </section>

    <section>
      <h2 class="field-title" data-i18n="dietTitle"></h2>
      <div class="toggles" id="diets"></div>
    </section>

    <section>
      <h2 class="field-title" data-i18n="noteTitle"></h2>
      <textarea id="opt-note" class="note" data-i18n-ph="notePh"></textarea>
    </section>

    <section class="options">
      <label><span data-i18n="timeLabel"></span>
        <select id="opt-time">
          <option value="0" data-i18n="any"></option>
          <option value="15">≤ 15</option>
          <option value="30">≤ 30</option>
          <option value="60">≤ 60</option>
        </select>
      </label>
      <label><span data-i18n="diffLabel"></span>
        <select id="opt-diff">
          <option value="" data-i18n="any"></option>
          <option value="easy" data-i18n="easy"></option>
          <option value="medium" data-i18n="medium"></option>
        </select>
      </label>
      <label><span data-i18n="servingsLabel"></span>
        <div class="stepper">
          <button type="button" id="srv-minus" aria-label="−">−</button>
          <output id="srv-out">2</output>
          <button type="button" id="srv-plus" aria-label="+">+</button>
        </div>
      </label>
      <label><span data-i18n="countLabel"></span>
        <select id="opt-count">
          <option value="6">6</option>
          <option value="9" data-pro>9 · Pro</option>
          <option value="12" data-pro>12 · Pro</option>
        </select>
      </label>
    </section>

    <button class="btn btn-primary" id="btn-find"><span data-i18n="find"></span></button>
    <p class="quota" id="quota"></p>
    </div>
  </aside>

  <!-- Sağ: sonuçlar -->
  <section aria-live="polite">
    <div class="results-bar">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-results" aria-selected="true" data-i18n="tabResults"></button>
        <button role="tab" id="tab-fav" aria-selected="false"><span data-i18n="tabFav"></span> <span id="fav-count"></span></button>
      </div>
      <label class="check"><input type="checkbox" id="only-complete"><span data-i18n="onlyComplete"></span></label>
      <select id="sort" aria-label="Sort">
        <option value="match" data-i18n="sortMatch"></option>
        <option value="time" data-i18n="sortTime"></option>
        <option value="kcal" data-i18n="sortKcal"></option>
      </select>
    </div>
    <div id="status"></div>
    <div class="grid" id="grid"></div>
    <div class="more" id="more" hidden><button class="btn btn-ghost" id="btn-more"><span data-i18n="more"></span></button></div>
    <div id="restaurants" hidden></div>
  </section>
</main>
<div id="print-area" aria-hidden="true"></div>

<!-- Tarif penceresi -->
<div class="overlay" id="recipe-modal" role="dialog" aria-modal="true" aria-labelledby="m-title" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="m-title"></h2>
      <button class="x" data-close aria-label="Close">&times;</button>
    </div>
    <div class="sheet-body" id="m-body"></div>
    <div class="sheet-foot" id="m-foot"></div>
  </div>
</div>

<!-- Alışveriş listesi -->
<div class="overlay drawer" id="shop-modal" role="dialog" aria-modal="true" aria-labelledby="s-title" hidden>
  <div class="sheet">
    <div class="sheet-head"><h2 id="s-title" data-i18n="shopTitle"></h2><button class="x" data-close aria-label="Close">&times;</button></div>
    <div class="sheet-body" id="s-body"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost btn-sm" id="shop-copy" data-i18n="copy"></button>
      <button class="btn btn-ghost btn-sm" id="shop-clear" data-i18n="clear"></button>
    </div>
  </div>
</div>

<!-- Ayarlar -->
<div class="overlay" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="set-title" hidden>
  <div class="sheet" style="max-width:520px">

        <label for="set-model" data-i18n="modelLabel"></label>
        <input id="set-model" type="text" autocomplete="off" spellcheck="false">
      </div>

        <label data-i18n="remindTitle"></label>
        <p class="hint" data-i18n="remindHelp"></p>

        <label><span data-i18n="famTitle"></span> <span class="pro-tag" data-pro-tag>Pro</span></label>

          <button class="btn btn-ghost btn-sm" id="bk-import"><span data-i18n="backupImport"></span> <span class="pro-tag" data-pro-tag>Pro</span></button>
        </div>
        <textarea id="bk-text" rows="4" hidden style="width:100%; margin-top:8px; font-family:monospace; font-size:.8rem"></textarea>

  </div>

<!-- Küçük giriş penceresi (isim sor vb.) -->
<div class="overlay" id="ask-modal" role="dialog" aria-modal="true" aria-labelledby="ask-title" hidden>
  <div class="sheet" style="max-width:420px">
    <div class="sheet-head"><h2 id="ask-title"></h2><button class="x" data-close aria-label="Close">&times;</button></div>
    <div class="sheet-body">
      <p class="hint" id="ask-hint" hidden></p>
      <input id="ask-input" type="text" autocomplete="off" enterkeyhint="done">
    </div>
    <div class="sheet-foot"><button class="btn btn-primary btn-sm" id="ask-ok" data-i18n="ok"></button></div>
  </div>
</div>

<!-- Kiler öğesi: son kullanma -->
<div class="overlay" id="item-modal" role="dialog" aria-modal="true" aria-labelledby="it-title" hidden>
  <div class="sheet" style="max-width:440px">
    <div class="sheet-head"><h2 id="it-title"></h2><button class="x" data-close aria-label="Close">&times;</button></div>
    <div class="sheet-body">
      <div class="form-row">
        <label for="it-date" data-i18n="expiryLabel"></label>
        <input id="it-date" type="date">
        <div class="quickdates" style="margin-top:8px">
          <button type="button" data-days="2" data-i18n="d2"></button>
          <button type="button" data-days="5" data-i18n="d5"></button>
          <button type="button" data-days="7" data-i18n="d7"></button>
          <button type="button" data-days="30" data-i18n="d30"></button>
          <button type="button" data-days="0" data-i18n="dNone"></button>
        </div>
      </div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-primary btn-sm" id="it-save" data-i18n="save"></button>
      <button class="btn btn-ghost btn-sm" id="it-remove" data-i18n="remove"></button>
    </div>
  </div>
</div>

<!-- Fotoğraftan malzeme -->
<div class="overlay" id="scan-modal" role="dialog" aria-modal="true" aria-labelledby="sc-title" hidden>
  <div class="sheet" style="max-width:520px">
    <div class="sheet-head"><h2 id="sc-title">📷 <span data-i18n="scanTitle"></span></h2><button class="x" data-close aria-label="Close">&times;</button></div>
    <div class="sheet-body" id="sc-body"></div>
    <div class="sheet-foot" id="sc-foot"></div>
  </div>
</div>

<!-- Misafir menüsü -->
<div class="overlay" id="guest-modal" role="dialog" aria-modal="true" aria-labelledby="g-title" hidden>
  <div class="sheet" style="max-width:600px">
    <div class="sheet-head"><h2 id="g-title">🍽️ <span data-i18n="guestTitle"></span></h2><button class="x" data-close aria-label="Close">&times;</button></div>
    <div class="sheet-body" id="g-body"></div>
    <div class="sheet-foot" id="g-foot"></div>
  </div>
</div>

<!-- Pro -->
<div class="overlay" id="pro-modal" role="dialog" aria-modal="true" aria-labelledby="pro-title" hidden>
  <div class="sheet" style="max-width:520px">
    <div class="sheet-head"><h2 id="pro-title">✨ <span data-i18n="proTitle"></span></h2><button class="x" data-close aria-label="Close">&times;</button></div>
    <div class="sheet-body paywall" id="pro-body"></div>
    <div class="sheet-foot" id="pro-foot"></div>
  </div>
</div>

<!-- Haftalık plan -->
<div class="overlay" id="plan-modal" role="dialog" aria-modal="true" aria-labelledby="plan-title" hidden>
  <div class="sheet" style="max-width:600px">
    <div class="sheet-head"><h2 id="plan-title">📅 <span data-i18n="planTitle"></span></h2><button class="x" data-close aria-label="Close">&times;</button></div>
    <div class="sheet-body" id="plan-body"></div>
    <div class="sheet-foot" id="plan-foot"></div>
  </div>
</div>

<!-- Pişirme modu -->
<div class="overlay cook" id="cook" role="dialog" aria-modal="true" aria-labelledby="c-title" hidden>
  <div class="cook-inner">
    <div class="cook-top"><h2 id="c-title"></h2><button class="x" data-close aria-label="Close">&times;</button></div>
    <div class="progress"><i id="c-bar"></i></div>
    <div class="cook-step">
      <div class="n" id="c-n"></div>
      <p id="c-text"></p>
      <div class="timer" id="c-timer" hidden>
        <span class="time" id="c-time">00:00</span>
        <button class="btn btn-sun btn-sm" id="c-timer-btn"></button>
      </div>
    </div>
    <div class="cook-voice" id="cook-voice" hidden>
      <button type="button" class="mic" id="c-mic" aria-pressed="false">🎤 <span data-i18n="voiceOn"></span></button>
      <button type="button" class="btn btn-ghost btn-sm" id="c-read">🔊 <span data-i18n="readStep"></span></button>
      <span id="c-heard"></span>
    </div>
    <div class="cook-nav">
      <button class="btn btn-ghost" id="c-prev" data-i18n="prev"></button>
      <button class="btn btn-primary" id="c-next"></button>
    </div>
  </div>
</div>

function fmtAmt(n) {
  if (!(n > 0)) return '';
  if (n >= 10) return String(Math.round(n));
  const w = Math.floor(n), f = n - w;
  const opts = [[0,''],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];
  let best = opts[0];
  for (const o of opts) if (Math.abs(o[0] - f) < Math.abs(best[0] - f)) best = o;
  const W = best[0] === 1 ? w + 1 : w;
  return (W > 0 ? W : '') + best[1] || String(Math.round(n * 100) / 100);
}

async function sha256(txt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function normalize(r) {
  const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : d; };
  const cuisine = CUISINES.some(c => c[0] === r.cuisine) ? r.cuisine : 'Other';
  const out = {
    name: String(r.name || '').trim(),
    cuisine,
    emoji: String(r.emoji || '🍲').slice(0, 8),
    description: String(r.description || ''),
    prep: Math.round(num(r.prepMinutes)), cook: Math.round(num(r.cookMinutes)),
    difficulty: ['easy','medium','hard'].includes(r.difficulty) ? r.difficulty : 'medium',
    servings: Math.max(1, Math.round(num(r.servings, 2))),
    calories: Math.round(num(r.calories)),
    protein: Math.round(num(r.proteinGrams)), carbs: Math.round(num(r.carbsGrams)), fat: Math.round(num(r.fatGrams)), cost: Math.round(num(r.estimatedCost)),
    ingredients: (Array.isArray(r.ingredients) ? r.ingredients : []).map(i => ({
      name: String(i.name || '').trim(), amount: num(i.amount), unit: String(i.unit || '').trim(), have: i.have !== false
    })).filter(i => i.name),
    steps: (Array.isArray(r.steps) ? r.steps : []).map(s => typeof s === 'string' ? { text: s, minutes: 0 } : ({ text: String(s.text || '').trim(), minutes: Math.round(num(s.minutes)) })).filter(s => s.text),
    tip: String(r.tip || ''),
    course: ['starter','main','dessert'].includes(r.course) ? r.course : '',
    schedule: String(r.schedule || '')
  };
  out.id = slug(out.name) + '-' + out.cuisine;
  return out;
}
const missingOf = r => r.ingredients.filter(i => !i.have);
const matchOf = r => r.ingredients.length ? Math.round(100 * (r.ingredients.length - missingOf(r).length) / r.ingredients.length) : 0;
const totalMin = r => r.prep + r.cook;
const isFav = r => favs.some(f => f.id === r.id);

class AppError extends Error { constructor(code, status) { super(code); this.code = code; this.status = status; } }

function contextLines() {
  let out = '';
  if (leftovers.length) out += `\n- Leftover cooked dishes to use up (top priority, transform them creatively): ${leftovers.join(', ')} (mark as have=true)`;
  if (prefs._priority && prefs._priority.length) out += `\n- These ingredients are about to spoil, use them in every recipe if sensible: ${prefs._priority.join(', ')}`;
  if (prefs.note && prefs.note.trim()) out += `\n- Tonight's situation (adapt portions, style and menu to it): ${prefs.note.trim()}`;
  if (pro && family.length) out += `\n- Household (STRICT: never violate an allergy, avoid dislikes): ${family.map(f => f.name + ': ' + f.notes).join('; ')}`;
  if (pro) {
    const liked = favs.slice(0, 8).map(r => r.name), recent = cooked.slice(0, 6).map(c => c.name);
    if (liked.length) out += `\n- The cook has liked these before (match their taste, don't copy them): ${liked.join(', ')}`;
    if (recent.length) out += `\n- Cooked recently (avoid repeating): ${recent.join(', ')}`;
  }
  if (dislikes.length) out += `\n- The cook did NOT like these; avoid them and anything very similar: ${dislikes.slice(0, 10).join(', ')}`;
  return out;
}
function buildPrompt(exclude) {
  const cuisinesTxt = selCuisines.length ? selCuisines.join(', ') : 'any cuisine, be creative and varied';
  const dietTxt = selDiets.length ? selDiets.join(', ') + ' (strict: never include anything that violates these)' : 'none';
  return `Create ${prefs.count} distinct, realistic home-cooking recipes. Write every text value in ${t('aiLang')}.

Cook's situation:
- Cuisine: ${cuisinesTxt}
- Ingredients on hand: ${pantry.join(', ')}
- Salt, black pepper, cooking oil and water are always available: mark them have=true.
- Dietary requirements: ${dietTxt}${contextLines()}
- Maximum total time (prep + cook): ${prefs.time ? prefs.time + ' minutes' : 'no limit'}
- Difficulty: ${prefs.diff || 'any'}
- Base servings: ${prefs.servings}

Rules:
- Build mostly on the ingredients on hand; at most 3 ingredients may be missing (have=false).
- "cuisine" must be exactly one of: ${CUISINES.map(c => c[0]).join(', ')}, Other.
- Each ingredient has name, amount (number, 0 if "to taste"), unit (short like g, ml, tbsp, tsp, piece; empty if none) and have.
- Each step is one clear action; "minutes" is the waiting/cooking time of that step in whole minutes, 0 if none.
- "emoji" is one emoji that represents the dish. "calories" is the estimated kcal per serving; "proteinGrams", "carbsGrams", "fatGrams" are estimated grams per serving.
- "description" is one appetizing sentence. "tip" is one short practical tip. "estimatedCost" is the estimated cost of ONE serving in ${lang === 'tr' ? 'Turkish lira' : 'US dollars'} as a whole number.${exclude.length ? '\n- Do NOT repeat these recipes: ' + exclude.join(', ') + '.' : ''}`;
}

const RECIPE_SCHEMA = {
  type: 'OBJECT',
  properties: { recipes: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
    name: { type: 'STRING' }, cuisine: { type: 'STRING' }, emoji: { type: 'STRING' }, description: { type: 'STRING' },
    prepMinutes: { type: 'INTEGER' }, cookMinutes: { type: 'INTEGER' },
    difficulty: { type: 'STRING', enum: ['easy','medium','hard'] },
    servings: { type: 'INTEGER' }, calories: { type: 'INTEGER' }, proteinGrams: { type: 'INTEGER' }, carbsGrams: { type: 'INTEGER' }, fatGrams: { type: 'INTEGER' }, estimatedCost: { type: 'INTEGER' }, course: { type: 'STRING' }, schedule: { type: 'STRING' },
    ingredients: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
      name: { type: 'STRING' }, amount: { type: 'NUMBER' }, unit: { type: 'STRING' }, have: { type: 'BOOLEAN' }
    }, required: ['name','amount','unit','have'] } },
    steps: { type: 'ARRAY', items: { type: 'OBJECT', properties: { text: { type: 'STRING' }, minutes: { type: 'INTEGER' } }, required: ['text','minutes'] } },
    tip: { type: 'STRING' }
  }, required: ['name','cuisine','emoji','description','prepMinutes','cookMinutes','difficulty','servings','calories','proteinGrams','carbsGrams','fatGrams','ingredients','steps','tip'] } } },
  required: ['recipes']
};

async function requestRecipes(exclude, promptText) {
  const payload = {
    contents: [{ role: 'user', parts: [{ text: promptText || buildPrompt(exclude) }] }],
    generationConfig: { responseMimeType: 'application/json', responseSchema: RECIPE_SCHEMA, temperature: 0.9 }
  };
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.model.trim())}:generateContent`;
  for (let attempt = 0; ; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 90000);
    let res;
    try {
      res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey() }, body: JSON.stringify(payload), signal: ctrl.signal });
    } catch (e) {
      throw new AppError(e.name === 'AbortError' ? 'timeout' : 'network');
    } finally { clearTimeout(timer); }

    if (res.ok) {
      try {
        const data = await res.json();
        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
        return (parsed.recipes || []).map(normalize).filter(r => r.name && r.ingredients.length && r.steps.length);
      } catch { throw new AppError('parse'); }
    }
    if ((res.status === 429 || res.status >= 500) && attempt < 2) { await sleep(1500 * (attempt + 1)); continue; }
    const body = await res.text().catch(() => '');
    if (res.status === 401 || res.status === 403 || /API key/i.test(body)) throw new AppError('badKey', res.status);
    if (res.status === 429) throw new AppError('rate', res.status);
    console.error('API error', res.status, body);
    throw new AppError('generic', res.status);
  }
}

async function findRecipes(append = false) {
  if (busy) return;
  if (!pantry.length && !leftovers.length) { toast(t('noIng')); $('#ing-input').focus(); return; }
  if (!apiKey()) { toast(t('err_noKey')); openOverlay($('#settings-modal')); return; }
  if (!canSearch()) { openPro(t('proLockQuota', { n: LIMITS.freeSearchesPerDay })); return; }
  if (!pro && Number(prefs.count) > 6) { prefs.count = 6; savePrefs(); syncPrefs(); }
  noteSearch();
  const clearPriority = () => { delete prefs._priority; };
  busy = true; view = 'results'; lastError = null;
  syncTabs();
  $('#btn-find').disabled = true;
  if (!append) { recipes = []; render(); }
  const moreBtn = $('#btn-more');
  if (append) { moreBtn.disabled = true; moreBtn.innerHTML = `<span class="spinner"></span> ${esc(t('loadingMore'))}`; }
  try {
    const list = await requestRecipes(append ? recipes.map(r => r.name) : []);
    const seen = new Set(recipes.map(r => r.id));
    recipes.push(...list.filter(r => !seen.has(r.id)));
    if (!recipes.length) lastError = 'empty';
  } catch (e) {
    if (append) toast(t('err_' + e.code) + (e.status ? ` (${e.status})` : ''));
    else lastError = e.code + (e.status ? ':' + e.status : '');
  } finally {
    busy = false; $('#btn-find').disabled = false; clearPriority();
    moreBtn.disabled = false; moreBtn.innerHTML = `<span>${esc(t('more'))}</span>`;
    render(); syncReminder();
  }
}

function visible() {
  let list = (view === 'fav' ? favs : recipes).slice();
  if ($('#only-complete').checked) list = list.filter(r => missingOf(r).length === 0);
  const s = $('#sort').value;
  if (s === 'match') list.sort((a, b) => matchOf(b) - matchOf(a) || totalMin(a) - totalMin(b));
  if (s === 'time') list.sort((a, b) => totalMin(a) - totalMin(b));
  if (s === 'kcal') list.sort((a, b) => (a.calories || 9999) - (b.calories || 9999));
  return list;
}

const stack = [];
function openOverlay(el) {
  el.hidden = false; stack.push(el);
  document.body.style.overflow = 'hidden';
  (el.querySelector('input, [data-close]') || el).focus?.();
}
function closeOverlay(el) {
  el.hidden = true;
  const i = stack.indexOf(el); if (i > -1) stack.splice(i, 1);
  if (!stack.length) document.body.style.overflow = '';
  if (el.id === 'cook') stopCook();
  if (el.id === 'ask-modal' && askResolve) { const r = askResolve; askResolve = null; r(''); }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && stack.length) closeOverlay(stack[stack.length - 1]);
  if (!$('#cook').hidden) {
    if (e.key === 'ArrowRight') $('#c-next').click();
    if (e.key === 'ArrowLeft') $('#c-prev').click();
  }
});
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) closeOverlay(ov); });
});

async function reverseCity(g) {
  // Şehir adını Gemini'den iste (ek servis gerekmez); kısa ve ucuz bir istek
  try {
    const r = await geminiJson(`Which city (and country) is at latitude ${g.lat}, longitude ${g.lng}? Answer with the city name only, in ${t('aiLang')}.`, { type: 'OBJECT', properties: { city: { type: 'STRING' } }, required: ['city'] });
    return (r.city || '').trim();
  } catch { return ''; }
}
async function geminiJson(prompt, schema) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.model.trim())}:generateContent`;
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey() }, body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json', responseSchema: schema, temperature: 0.2 } }) });
  if (!res.ok) throw new AppError(res.status === 429 ? 'rate' : 'generic', res.status);
  const data = await res.json(); return JSON.parse(data.candidates[0].content.parts[0].text);
}

/* =====================================================================
   Restoranlar: Google Places (anahtar varsa) + sponsorlar + Haritalar bağlantısı
   ===================================================================== */
let sponsors = null;
async function loadSponsors() {
  if (sponsors) return sponsors;
  try { const r = await fetch(SPONSORS_URL, { cache: 'no-store' }); sponsors = r.ok ? await r.json() : {}; } catch { sponsors = {}; }
  return sponsors;
}
function norm(x) { return String(x || '').toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim(); }
function matchSponsors(sp, dish, cityName) {
  const out = [];
  for (const entry of (sp.sponsors || [])) {
    if (entry.enabled === false) continue;
    const cityOk = !entry.city || norm(entry.city) === norm(cityName);
    const dishOk = !entry.dishes || entry.dishes.some(d => norm(dish).includes(norm(d)) || norm(d).includes(norm(dish)));
    if (cityOk && dishOk) out.push(Object.assign({ sponsored: true }, entry));
  }
  return out.sort((a, b) => (a.rank || 99) - (b.rank || 99)).slice(0, 2);
}
async function placesSearch(dish, cityName) {
  if (!PLACES_KEY) return null;
  const body = { textQuery: `${dish} restoran ${cityName}`, languageCode: lang === 'tr' ? 'tr' : 'en', maxResultCount: 10 };
  if (geo && norm(cityName) === norm(city)) body.locationBias = { circle: { center: { latitude: geo.lat, longitude: geo.lng }, radius: 15000 } };
  const res = await fetch('https://places.googleapis.com/v1/places:searchText', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': PLACES_KEY,
    'X-Goog-FieldMask': 'places.displayName,places.rating,places.userRatingCount,places.formattedAddress,places.googleMapsUri,places.priceLevel,places.currentOpeningHours.openNow,places.nationalPhoneNumber' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('places ' + res.status);
  const data = await res.json();
  return (data.places || []).map(p => ({ name: p.displayName?.text || '', rating: p.rating || 0, count: p.userRatingCount || 0, address: p.formattedAddress || '', maps: p.googleMapsUri || '', price: p.priceLevel || '', open: p.currentOpeningHours ? p.currentOpeningHours.openNow : null, phone: p.nationalPhoneNumber || '' }));
}
// Places anahtarı yoksa: Gemini + Google Haritalar temellendirmesi (desteklenmiyorsa sessizce vazgeçer)
async function mapsGrounded(dish, cityName) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.model.trim())}:generateContent`;
  const body = {
    contents: [{ role: 'user', parts: [{ text: `Find up to 8 well-rated restaurants that serve "${dish}" in ${cityName}. Use Google Maps data. Reply ONLY with a JSON array, no prose, each item: {"name":"","rating":4.5,"count":120,"address":"","open":true|false|null,"phone":""}. Use the real Google rating and review count; if unknown use 0. Names and addresses in ${t('aiLang')}.` }] }],
    tools: [{ googleMaps: {} }],
    generationConfig: { temperature: 0.1 }
  };
  if (geo && norm(cityName) === norm(city)) body.toolConfig = { retrievalConfig: { latLng: { latitude: geo.lat, longitude: geo.lng } } };
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey() }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('maps grounding ' + res.status);
  const data = await res.json();
  const cand = data.candidates && data.candidates[0]; if (!cand) throw new Error('no candidate');
  const text = (cand.content.parts || []).map(p => p.text || '').join('');
  const m = text.match(/\[[\s\S]*\]/); if (!m) throw new Error('no json');
  const arr = JSON.parse(m[0]);
  const chunks = ((cand.groundingMetadata || {}).groundingChunks || []).map(c => c.maps || {}).filter(x => x.uri);
  return arr.filter(r => r && r.name).slice(0, 8).map(r => {
    const ch = chunks.find(c => norm(c.title || '') === norm(r.name)) || chunks.find(c => norm(c.title || '').includes(norm(r.name).split(' ')[0]));
    return { name: String(r.name), rating: Number(r.rating) || 0, count: Number(r.count) || 0, address: String(r.address || ''), open: typeof r.open === 'boolean' ? r.open : null, phone: String(r.phone || ''), maps: ch ? ch.uri : '' , ai: true };
  });
}
function stars(r) { const f = Math.round(r); return '★'.repeat(f) + '☆'.repeat(Math.max(0, 5 - f)); }
function restCard(r) {
  const maps = r.maps || `https://www.google.com/maps/search/${encodeURIComponent(r.name + ' ' + (r.address || city))}`;
  return `<div class="rest ${r.sponsored ? 'sponsored' : ''}">${r.sponsored ? `<span class="sp">${esc(t('restSponsored'))}</span>` : ''}
    <h3>${esc(r.name)}</h3>
    ${r.rating ? `<div class="rate"><span class="stars" aria-hidden="true">${stars(r.rating)}</span>${Number(r.rating).toFixed(1)} <small style="color:var(--muted);font-weight:500">(${r.count} ${esc(t('reviews'))})</small></div>` : ''}
    ${r.address ? `<div class="addr">${esc(r.address)}</div>` : ''}${r.note ? `<div class="addr">${esc(r.note)}</div>` : ''}
    ${r.open === true ? `<span class="open-now">● ${esc(t('restOpen'))}</span>` : r.open === false ? `<span class="closed-now">● ${esc(t('restClosed'))}</span>` : ''}
    <div class="act"><a href="${esc(maps)}" target="_blank" rel="noopener">🗺️ ${esc(t('restMaps'))}</a>${r.phone ? `<a href="tel:${esc(r.phone)}">📞 ${esc(t('restCall'))}</a>` : ''}</div>
  </div>`;
}
async function loadRestaurants(dish, cityName) {
  const box = $('#restaurants'); box.hidden = false;
  if (!cityName) { box.innerHTML = `<div class="rest-head"><h2>🍽️ ${esc(dish)}</h2></div><p class="hint">${esc(t('restCity'))}</p>`; return; }
  box.innerHTML = `<div class="rest-head"><h2>${esc(t('restTitle', { dish, city: cityName }))}</h2></div><div class="cooking" style="padding:16px 0"><div class="dots"><i></i><i></i><i></i></div><div class="sub">${esc(t('restSearching'))}</div></div>`;
  const sp = matchSponsors(await loadSponsors(), dish, cityName);
  let list = null, viaAI = false;
  try { list = await placesSearch(dish, cityName); } catch (e) { console.warn(e); list = null; }
  if (list === null && apiKey()) { try { list = await mapsGrounded(dish, cityName); viaAI = list && list.length ? true : false; if (!list.length) list = null; } catch (e) { console.warn(e); list = null; } }
  const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(dish + ' ' + (lang === 'tr' ? 'restoran ' : 'restaurant ') + cityName)}`;
  let html = `<div class="rest-head"><h2>${esc(t('restTitle', { dish, city: cityName }))}</h2></div>`;
  const cards = sp.map(restCard).join('') + (list ? list.filter(r => !sp.some(x => norm(x.name) === norm(r.name))).map(restCard).join('') : '');
  if (list === null) html += `${cards ? `<div class="rest-list">${cards}</div>` : ''}<p class="hint" style="margin-top:12px">${esc(t('restNoKey'))}</p><a class="btn btn-ghost btn-sm" href="${esc(mapsUrl)}" target="_blank" rel="noopener">${esc(t('restMapsBtn', { dish, city: cityName }))}</a>`;
  else if (!cards) html += `<p class="hint">${esc(t('restNone'))}</p><a class="btn btn-ghost btn-sm" href="${esc(mapsUrl)}" target="_blank" rel="noopener">${esc(t('restMapsBtn', { dish, city: cityName }))}</a>`;
  else html += `<div class="rest-list">${cards}</div>` + (viaAI ? `<p class="hint" style="margin-top:10px">${esc(t('restAI'))} · <a href="${esc(mapsUrl)}" target="_blank" rel="noopener">${esc(t('restMaps'))}</a></p>` : '');
  box.innerHTML = html;
}

   Tasarruf, besin günlüğü, hafta sonu görevi, aylık kart
   ===================================================================== */
const cur = () => lang === 'tr' ? '₺' : '$';
function mealSaving(c) {
  const r = c.recipe || {}; const order = ORDER_COST[lang] * Math.max(1, Math.round((r.servings || 2) / 2));
  const costMeal = r.cost ? r.cost * (r.servings || prefs.servings || 2) : order * 0.35;
  return Math.max(0, order - costMeal);
}
function monthCooked() { const now = new Date(); return cooked.filter(c => { const d = new Date(c.at); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }); }
function savingsHtml() {
  const mc = monthCooked(); if (!mc.length) return '';
  const total = Math.round(mc.reduce((a, c) => a + mealSaving(c), 0));
  return `<div class="save-box"><div><div class="amt">~${cur()}${total}</div><small>${esc(t('savingsTitle'))}</small></div><div><div>${esc(t('savingsText', { n: mc.length }))}</div><small>${esc(t('savingsEst', { d: cur() + ORDER_COST[lang] }))}${pro ? '' : ' · <b>' + esc(t('savingsPro')) + '</b>'}</small></div></div>`;
}
function nutriHtml() {
  if (!pro) return '';
  const today = new Date().toDateString();
  const td = cooked.filter(c => new Date(c.at).toDateString() === today);
  const wk = cooked.filter(c => Date.now() - new Date(c.at) < 7 * DAY);
  const sum = (arr, k) => arr.reduce((a, c) => a + ((c.recipe || {})[k] || 0), 0);
  if (!td.length && !wk.length) return '';
  return `<div class="nutri"><div class="box"><b>${sum(td, 'calories')} ${esc(t('kcalShort'))}</b>${esc(t('nutriToday'))} · ${sum(td, 'protein')} ${esc(t('protShort'))}</div><div class="box"><b>${Math.round(sum(wk, 'calories') / 7)} ${esc(t('kcalShort'))}</b>${esc(t('nutriWeek'))} · ${Math.round(sum(wk, 'protein') / 7)} ${esc(t('protShort'))}</div></div>`;
}
function weekendState() {
  const now = new Date(), day = now.getDay(); // 0 Paz, 5 Cum, 6 Cmt
  if (![5, 6, 0].includes(day)) return null;
  const start = new Date(now); start.setDate(now.getDate() - (day === 0 ? 2 : day - 5)); start.setHours(0, 0, 0, 0);
  const before = new Set(cooked.filter(c => new Date(c.at) < start).map(c => c.cuisine));
  const done = cooked.some(c => new Date(c.at) >= start && !before.has(c.cuisine));
  return { done };
}

let scanFound = [];
function renderScan(state, data) {
  const body = $('#sc-body'), foot = $('#sc-foot');
  if (state === 'idle') { body.innerHTML = `<p class="hint">${esc(t('scanHelp'))}</p>`; foot.innerHTML = `<button class="btn btn-primary btn-sm" id="sc-pick">📷 ${esc(t('scanPick'))}</button>`; }

  if (state === 'done') {
    body.innerHTML = `<img class="scan-prev" src="${data}" alt="">` + (scanFound.length
      ? `<div class="scan-list">${scanFound.map((n, i) => `<label><input type="checkbox" data-sc="${i}" checked>${esc(n)}</label>`).join('')}</div>`
      : `<p class="hint">${esc(t('scanNone'))}</p>`);
    foot.innerHTML = (scanFound.length ? `<button class="btn btn-primary btn-sm" id="sc-add">${esc(t('scanAdd', { n: scanFound.length }))}</button>` : '') + `<button class="btn btn-ghost btn-sm" id="sc-pick">${esc(t('scanAgain'))}</button>`;
  }
}
function shrinkImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1024, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', .85));
    };
    img.onerror = rej; img.src = url;
  });
}
async function scanPhoto(file) {
  if (!apiKey()) { toast(t('err_noKey')); return; }
  if (!canSearch()) { openPro(t('proLockQuota', { n: LIMITS.freeSearchesPerDay })); return; }
  const dataUrl = await shrinkImage(file);
  renderScan('busy', dataUrl);
  const payload = {
    contents: [{ role: 'user', parts: [
      { inlineData: { mimeType: 'image/jpeg', data: dataUrl.split(',')[1] } },
      { text: `List every food ingredient visible in this photo. It may be a fridge, a pantry shelf, a kitchen counter, or a grocery receipt (then read the purchased food items). Use short generic ingredient names in ${t('aiLang')} (e.g. "domates", not brand names), singular, lowercase, no quantities. Skip non-food items, drinks like water, and anything you are unsure about.` }
    ] }],
    generationConfig: { responseMimeType: 'application/json', responseSchema: { type: 'OBJECT', properties: { ingredients: { type: 'ARRAY', items: { type: 'STRING' } } }, required: ['ingredients'] }, temperature: 0.2 }
  };
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings.model.trim())}:generateContent`;
  try {
    noteSearch();
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey() }, body: JSON.stringify(payload) });
    if (!res.ok) throw new AppError(res.status === 429 ? 'rate' : res.status === 403 || res.status === 401 ? 'badKey' : 'generic', res.status);
    const data = await res.json();
    const list = JSON.parse(data.candidates[0].content.parts[0].text).ingredients || [];
    scanFound = [...new Set(list.map(x => String(x).trim().toLowerCase()).filter(x => x && x.length < 40))].slice(0, 40);
    renderScan('done', dataUrl);
  } catch (e) { toast(t('err_' + (e.code || 'network'))); renderScan('idle'); }
}
$('#btn-scan').addEventListener('click', () => { renderScan('idle'); openOverlay($('#scan-modal')); });
$('#sc-foot').addEventListener('click', e => {
  if (e.target.closest('#sc-pick')) { $('#scan-file').value = ''; $('#scan-file').click(); }
  if (e.target.closest('#sc-add')) {
    const chosen = [...$('#sc-body').querySelectorAll('[data-sc]:checked')].map(cb => scanFound[Number(cb.dataset.sc)]);

function wrapText(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line); return lines;
}
function shareCard(r) {
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = '#1F6B45'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#F2B01E'; x.beginPath(); x.roundRect(80, 80, 920, 300, 36); x.fill();
  x.font = '150px "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(r.emoji, W / 2, 232);
  x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.fillStyle = '#fff';
  x.font = '800 68px "Bricolage Grotesque", "Segoe UI", sans-serif';
  let y = 480; wrapText(x, r.name, 920).slice(0, 2).forEach(l => { x.fillText(l, 80, y); y += 80; });
  x.font = '500 34px Figtree, "Segoe UI", sans-serif'; x.fillStyle = '#DDEFE3';
  wrapText(x, r.description, 920).slice(0, 2).forEach(l => { x.fillText(l, 80, y); y += 46; });
  y += 20; x.fillStyle = '#F2B01E'; x.font = '700 32px Figtree, "Segoe UI", sans-serif';
  x.fillText(`⏱ ${totalMin(r)} ${t('min')}   ·   ${t(r.difficulty)}   ·   ${t('servingsFor', { n: r.servings })}${r.calories ? '   ·   🔥 ' + r.calories + ' ' + t('kcal') : ''}`, 80, y); y += 60;
  x.fillStyle = '#fff'; x.font = '800 36px "Bricolage Grotesque", "Segoe UI", sans-serif'; x.fillText(t('ingredients'), 80, y); y += 50;
  x.font = '500 32px Figtree, "Segoe UI", sans-serif';
  const ings = r.ingredients.slice(0, 12); const col = Math.ceil(ings.length / 2);
  ings.forEach((i, k) => { const cx = 80 + (k >= col ? 470 : 0), cy = y + (k % col) * 44; x.fillStyle = i.have ? '#fff' : '#FDEBC2'; x.fillText('• ' + ingredientLine(i, 1).slice(0, 26), cx, cy); });
  y += col * 44 + 30; if (r.ingredients.length > 12) { x.fillStyle = '#DDEFE3'; x.fillText('+' + (r.ingredients.length - 12), 80, y); }
  // alt bant
  x.fillStyle = '#F2B01E'; x.beginPath(); x.roundRect(80, H - 170, 920, 90, 999); x.fill();
  x.fillStyle = '#3A2A00'; x.font = '800 36px "Bricolage Grotesque", "Segoe UI", sans-serif'; x.textAlign = 'center';
  x.fillText('🍳 ' + t('appTitle') + '  ·  ' + t('tagline').split(/[,.]/)[0], W / 2, H - 112);
  const png = c.toDataURL('image/png');
  if (NATIVE && NATIVE.shareImage) NATIVE.shareImage(r.name, png);
  else { const a = document.createElement('a'); a.href = png; a.download = slug(r.name) + '.png'; a.click(); }
  toast(t('shareReady'));
}

function renderSets() {

  el.innerHTML = pantrySets.map((s, i) => `<button type="button" data-set="${i}" title="${esc(s.items.join(', '))}">📦 ${esc(s.name)} <span class="del" data-set-del="${i}" aria-label="Delete">×</span></button>`).join('') +
    (pantry.length ? `<button type="button" data-set-save>${esc(t('setsSave'))}${pro ? '' : ' <span class="pro-tag">Pro</span>'}</button>` : '');
}
$('#pantry-sets').addEventListener('click', async e => {
  const del = e.target.closest('[data-set-del]');
  if (del) { e.stopPropagation(); pantrySets.splice(Number(del.dataset.setDel), 1); store.set('pantrySets', pantrySets); renderSets(); return; }
  if (e.target.closest('[data-set-save]')) {
    if (!requirePro('proLockFeature')) return;
    const name = await ask(t('setsName'), { value: t('setsDefault') }); if (!name) return;
    pantrySets = pantrySets.filter(s => s.name !== name); pantrySets.unshift({ name, items: pantry.slice() });
    store.set('pantrySets', pantrySets); renderSets(); toast(t('setsSaved')); return;
  }
  const b = e.target.closest('[data-set]'); if (!b) return;
  pantry = pantrySets[Number(b.dataset.set)].items.slice(); store.set('pantry', pantry);
  renderChips(); renderQuick(); renderSets(); toast(t('setsLoaded', { n: pantry.length }));
});
